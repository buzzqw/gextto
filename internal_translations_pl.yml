  "Indirizzo di ascolto del demone: la pagina web e l'API sono aperte su tutta la LAN (predefinito 0.0.0.0:8890). Il traffico peer usa sempre la porta singola/le libtorrent_port_*. Se ascolti in rete serve gxtorrent_token (senza token Gextto avvia il demone in -insecure e lo segnala nel log). Per tenerlo solo su questo server usa 127.0.0.1:8890.": "Adres nasłuchu usługi: strona i API są otwarte dla całej sieci LAN (domyślnie 0.0.0.0:8890). Ruch peerów zawsze używa pojedynczego portu/libtorrent_port_*. Przy nasłuchu w sieci potrzebny jest gxtorrent_token (bez tokenu Gextto uruchamia usługę z -insecure i zapisuje to w logu). Aby została tylko na tym serwerze, użyj 127.0.0.1:8890."
