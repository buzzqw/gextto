  ? 'Quando attiva, il sistema regola da solo Max download attivi, Max upload attivi e Max totali (qui sopra, che diventano solo il punto di partenza
    a ogni riavvio del ciclo ~2h — i campi si disabilitano). Max download attivi si muove tra Minimo e Massimo qui sotto, in base a quanta della
    banda che HAI impostato (Limite download) viene davvero usata — non una banda ''reale'' misurata, ma il tuo tetto configurato: sopra il 90%
    per un po'' riduce gli slot (aggiungerne altri diluirebbe solo la banda), sotto il 50% con torrent in coda con fonti reali non sfruttate li
    aumenta. Max upload attivi scende a 1 quando c''è un download vicino al completamento in corso (il seeding può aspettare) e torna al valore
    configurato quando finisce. Max totali si adatta di conseguenza per non diventare lui stesso il collo di bottiglia. Assegna anche più connessioni,
    slot upload e banda ai singoli torrent più vicini al completamento o con più fonti (peer/seed) rispetto a quelli lenti o senza fonti. Se disattivata,
    tutto torna ai tre valori statici configurati sopra.'
  : 'Gdy jest aktywny, system sam dostosowuje maksymalną liczbę aktywnych pobrań, maksymalną liczbę aktywnych przesłanych plików i maksymalne
    sumy (powyżej, które stają się punktem wyjścia dopiero przy każdym ponownym uruchomieniu cyklu ~2 godzin — pola są wyłączone). Maksymalna
    liczba aktywnych pobrań waha się pomiędzy Minimalną a Maksymalną poniżej, w zależności od tego, jaka część ustawionej przepustowości (Limit
    pobierania) jest faktycznie używana — nie zmierzona „rzeczywista” przepustowość, ale skonfigurowany pułap: powyżej 90% na jakiś czas zmniejsza
    liczbę szczelin (dodanie większej liczby tylko osłabi przepustowość), poniżej 50% w przypadku torrentów ustawionych w kolejce z prawdziwymi
    niewykorzystanymi źródłami zwiększa je. Maksymalna liczba aktywnych przesyłanych plików spada do 1, gdy trwa prawie całkowite pobieranie (wypełnianie
    może poczekać) i powraca do skonfigurowanej wartości po jego zakończeniu. Maksymalne sumy odpowiednio się dostosowują, aby same nie stać się
    wąskim gardłem. Przydziela także więcej połączeń, miejsc na przesyłanie i przepustowość poszczególnym torrentom, które są bliższe ukończenia
    lub mają więcej źródeł (peer/seed) niż tym, które są wolne lub nie mają źródeł. Jeśli jest dezaktywowany, wszystko powraca do trzech wartości
    statycznych skonfigurowanych powyżej.'
