  "Prossimi episodi e uscite dei film da aggiungere a Thunderbird, Google Calendar o al telefono: copia l'indirizzo del link e iscriviti al calendario. Con l'accesso protetto aggiungi ?apikey=<chiave> all'indirizzo.": "Nadchodzące odcinki i premiery filmów dla Thunderbirda, Kalendarza Google lub telefonu: skopiuj adres linku i zasubskrybuj kalendarz. Przy chronionym dostępie dodaj ?apikey=<klucz> do adresu."
  "Serie TV · messa in onda originale": "Seriale · pierwotna emisja"
  "Data della prima messa in onda originale (TMDB): la versione italiana può arrivare molto più tardi.": "Data pierwotnej emisji (TMDB): wersja zlokalizowana może pojawić się znacznie później."
  "Anime (numerazione assoluta)": "Anime (numeracja bezwzględna)"
  "Niente upgrade": "Bez ulepszeń"
  "Le release degli anime numerano gli episodi dall'inizio senza stagioni («Titolo - 1071»): Gextto converte il numero in stagione ed episodio con i dati TMDB e cerca anche il numero assoluto.": "Wydania anime numerują odcinki od początku bez sezonów („Tytuł - 1071”): Gextto przelicza numer na sezon i odcinek na podstawie danych TMDB i szuka także numeru bezwzględnego."
  "Una release migliore non sostituisce più un file già archiviato di questa serie.": "Lepsze wydanie nie zastępuje już zarchiwizowanego pliku tego serialu."
  "Download in corso": "Trwające pobierania"
  "Attivo: un file che resta in seed entra in libreria come hardlink, cioè un secondo nome per gli stessi dati, senza occupare spazio due volte. Cancellare uno dei due nomi non tocca l'altro. Funziona solo se download e libreria sono sullo stesso filesystem; altrimenti gextto copia come prima.": "Włączone: plik, który nadal jest seedowany, trafia do biblioteki jako twarde dowiązanie, czyli druga nazwa tych samych danych, bez zajmowania miejsca dwa razy. Usunięcie jednej z nazw nie wpływa na drugą. Działa tylko, gdy pobrane pliki i biblioteka są w tym samym systemie plików; w przeciwnym razie gextto kopiuje jak dotąd."
  "Solo se Jellyfin vede la libreria con percorsi diversi (es. Docker): una riga per cartella, percorso_gextto=percorso_jellyfin. Serve per chiedere a Jellyfin di aggiornare solo la cartella appena cambiata.": "Tylko gdy Jellyfin widzi bibliotekę pod innymi ścieżkami (np. Docker): jedna linia na folder, ścieżka_gextto=ścieżka_jellyfin. Służy do poproszenia Jellyfin o odświeżenie tylko folderu, który właśnie się zmienił."
  "Solo se Plex vede la libreria con percorsi diversi (es. Docker): una riga per cartella, percorso_gextto=percorso_plex. Serve per chiedere a Plex di aggiornare solo la cartella appena cambiata.": "Tylko gdy Plex widzi bibliotekę pod innymi ścieżkami (np. Docker): jedna linia na folder, ścieżka_gextto=ścieżka_plex. Służy do poproszenia Plex o odświeżenie tylko folderu, który właśnie się zmienił."
  "Quando il file in libreria ha almeno questo punteggio non si cercano più miglioramenti; resta accettato solo un REPACK o PROPER che corregge una release difettosa. Riferimenti: 1080p WEB-DL H.264 ≈ 1280, 1080p WEB-DL H.265 DD+ ≈ 1480, 2160p ≈ 2480. 0 = migliora sempre. Per fermare del tutto gli upgrade di un solo titolo usa «Niente upgrade» nella sua scheda.": "Gdy plik w bibliotece ma co najmniej taki wynik, nie szuka się już ulepszeń; akceptowany jest tylko REPACK lub PROPER poprawiający wadliwe wydanie. Punkty odniesienia: 1080p WEB-DL H.264 ≈ 1280, 1080p WEB-DL H.265 DD+ ≈ 1480, 2160p ≈ 2480. 0 = zawsze ulepszaj. Aby zatrzymać ulepszenia jednego tytułu, użyj „Bez ulepszeń” na jego stronie."
  "Spento (predefinito): chiunque raggiunga gextto lo usa, come in una LAN fidata. Acceso: chi non è in rete locale deve fare il login o usare la chiave API. Resta aperto finché non imposti una password o una chiave. Se resti chiuso fuori, avvia gextto con GEXTTO_AUTH_DISABLE=1.": "Wyłączone (domyślnie): każdy, kto dotrze do gextto, może z niego korzystać, jak w zaufanej sieci LAN. Włączone: spoza sieci lokalnej trzeba się zalogować lub użyć klucza API. Pozostaje otwarte, dopóki nie ustawisz hasła lub klucza. Jeśli zablokujesz sobie dostęp, uruchom gextto z GEXTTO_AUTH_DISABLE=1."
  "Acceso (predefinito): dalla rete di casa (127.0.0.1, 192.168.x.x, 10.x.x.x, 172.16-31.x.x) non serve il login. Dietro un reverse proxy conta l'indirizzo reale del client inoltrato dal proxy.": "Włączone (domyślnie): z sieci domowej (127.0.0.1, 192.168.x.x, 10.x.x.x, 172.16-31.x.x) logowanie nie jest potrzebne. Za odwrotnym proxy liczy się prawdziwy adres klienta przekazany przez proxy."
  "Nome utente per il login (predefinito admin).": "Nazwa użytkownika do logowania (domyślnie admin)."
  "Password per il login. Viene salvata solo come hash; lascia vuoto per non cambiarla.": "Hasło do logowania. Zapisywane tylko jako skrót; pozostaw puste, aby go nie zmieniać."
  "Chiave per script, TUI (variabile GEXTTO_API_KEY) e calendario iCal: header X-Api-Key oppure ?apikey= nell'indirizzo. Scegli una stringa lunga e casuale.": "Klucz dla skryptów, TUI (zmienna GEXTTO_API_KEY) i kalendarza iCal: nagłówek X-Api-Key lub ?apikey= w adresie. Wybierz długi, losowy ciąg znaków."
  "Accedi per continuare.": "Zaloguj się, aby kontynuować."
