# Path validators of gextto that CodeQL cannot recognise on its own. Each entry
# describes code that really confines a path; it is not a blanket suppression.
extensions:
  - addsTo:
      pack: codeql/go-all
      extensible: barrierGuardModel
    data:
      # pathStartsWith(path, prefix): filepath.Rel-based containment check;
      # true means path is prefix or lies below it.
      - ["github.com/buzzqw/gextto", "", False, "pathStartsWith", "", "", "Argument[0]", "true", "path-injection", "manual"]
      # folderRenameWithin(root, path): same containment check for the folder rename.
      - ["github.com/buzzqw/gextto", "", False, "folderRenameWithin", "", "", "Argument[1]", "true", "path-injection", "manual"]
      # manualImportAllowed(cfg, path): the manual import only reads files inside
      # the configured download and archive roots.
      - ["github.com/buzzqw/gextto", "", False, "manualImportAllowed", "", "", "Argument[1]", "true", "path-injection", "manual"]
      # anyPathStartsWith(path, prefixes): the same check over the comics folders
      # the operator configured; it is true only when one of them contains path.
      - ["github.com/buzzqw/gextto", "", False, "anyPathStartsWith", "", "", "Argument[0]", "true", "path-injection", "manual"]
      # isConfiguredArchive(cfg, db, hash, destination): the manual storage move
      # goes to a folder Gextto itself would use (series archive or the
      # destination configured for the release).
      - ["github.com/buzzqw/gextto", "", False, "isConfiguredArchive", "", "", "Argument[3]", "true", "path-injection", "manual"]
      # comicSavePathAllowed(cfg, monitored, target): a comic is saved only in
      # the data, download or comics folder, or where a monitored comic lives.
      - ["github.com/buzzqw/gextto", "", False, "comicSavePathAllowed", "", "", "Argument[2]", "true", "path-injection", "manual"]
      # moveDestinationAllowed(cfg, db, hash, destination): a manual torrent
      # storage move only goes to a folder Gextto itself writes.
      - ["github.com/buzzqw/gextto", "", False, "moveDestinationAllowed", "", "", "Argument[3]", "true", "path-injection", "manual"]
  - addsTo:
      pack: codeql/go-all
      extensible: barrierModel
    data:
      # comicDownloadFilename keeps only [A-Za-z0-9._-] and spaces: never a separator.
      - ["github.com/buzzqw/gextto", "", False, "comicDownloadFilename", "", "", "ReturnValue", "path-injection", "manual"]
      # stateTorrentName(hash) returns "<40 or 64 hex>.torrent" or "": the hash
      # arrives from the API and from the engines, so anything that is not an
      # infohash is refused instead of being joined into a path.
      - ["github.com/buzzqw/gextto", "", False, "stateTorrentName", "", "", "ReturnValue", "path-injection", "manual"]
      # v2SearchRedirectTarget(value, fallback) returns one of a fixed set of
      # view paths or the fallback: the request value never reaches the redirect.
      - ["github.com/buzzqw/gextto", "", False, "v2SearchRedirectTarget", "", "", "ReturnValue", "url-redirection", "manual"]
