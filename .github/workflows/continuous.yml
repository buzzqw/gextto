name: Continuous Linux build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: continuous-linux-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libtorrent-rasterbar-dev

      - name: Test
        run: make test

      - name: Test engine
        run: make test-engine

  # The archive is built on the oldest supported baseline (Ubuntu 22.04,
  # glibc 2.35): a binary linked on a newer system does not start on Debian 12
  # or Ubuntu 22.04. See scripts/build-release.sh.
  # The build number is not taken from github.run_number: build-daemon.sh reads
  # the committed build_number file, so the installed version shows the same
  # 1.1.<n> as the checkout.
  # Each architecture is built twice: the default pure Go archive and the
  # variant with the embedded libtorrent engine, published as
  # gextto-linux-<arch>-libtorrent.tar.gz.
  package:
    name: package (${{ matrix.arch }}, ${{ matrix.variant }})
    needs: test
    strategy:
      matrix:
        arch: [x86_64, aarch64]
        variant: [go, libtorrent]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - variant: go
            libtorrent: '0'
            suffix: ''
          - variant: libtorrent
            libtorrent: '1'
            suffix: '-libtorrent'
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git curl

      - name: Check out source
        uses: actions/checkout@v7

      - name: Build and package
        env:
          GEXTTO_LIBTORRENT: ${{ matrix.libtorrent }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/build-release.sh --in-container --label "continuous-${GITHUB_SHA::12}" --output-dir dist

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: gextto-linux-${{ matrix.arch }}${{ matrix.suffix }}
          path: dist/gextto-linux-${{ matrix.arch }}${{ matrix.suffix }}.tar.gz*
          if-no-files-found: error

      - name: Upload standalone gx-torrent archive
        if: matrix.variant == 'go'
        uses: actions/upload-artifact@v4
        with:
          name: gx-torrent-linux-${{ matrix.arch }}
          path: dist/gx-torrent-linux-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error

  publish:
    name: publish continuous
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # release.json lists the recent commits as the in-app changelog.
          fetch-depth: 200

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release manifest
        run: |
          scripts/release-manifest.sh --channel continuous --label "continuous-${GITHUB_SHA::12}" \
            --output dist/release.json

      - name: Publish continuous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete continuous --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create continuous \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Gextto continuous build" \
            --notes "Automatic build from commit $GITHUB_SHA on main (build $(cat build_number))." \
            --prerelease \
            dist/gextto-linux-*.tar.gz \
            dist/gextto-linux-*.tar.gz.sha256 \
            dist/gx-torrent-linux-*.tar.gz \
            dist/gx-torrent-linux-*.tar.gz.sha256 \
            dist/release.json
