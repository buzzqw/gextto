name: Continuous Linux build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: continuous-linux-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: build and publish continuous
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libtorrent-rasterbar-dev

      - name: Test
        run: make test

      - name: Build and package
        env:
          GEXTTO_BUILD: ${{ github.run_number }}
        run: |
          scripts/build-daemon.sh
          scripts/package-linux.sh --label "continuous-${GITHUB_SHA::12}"

      - name: Publish continuous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete continuous --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create continuous \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Gextto continuous build" \
            --notes "Automatic build from commit $GITHUB_SHA on main (run $GITHUB_RUN_NUMBER)." \
            --prerelease \
            gextto-linux-*.tar.gz \
            gextto-linux-*.tar.gz.sha256
