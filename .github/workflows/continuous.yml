name: Continuous Linux build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: continuous-linux-build
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  security-events: write

jobs:
  quality:
    name: release quality gates
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/release-gates.yml
    with:
      fuzz-time: 30s
      codeql: true

  # The archive is built on the oldest supported baseline (Ubuntu 22.04,
  # glibc 2.35): a binary linked on a newer system does not start on Debian 12
  # or Ubuntu 22.04. See scripts/build-release.sh.
  # Each architecture ships one pure Go archive (gx-torrent engine).
  package:
    name: package (${{ matrix.arch }})
    needs: quality
    strategy:
      matrix:
        arch: [x86_64, aarch64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    steps:
      # The runner's DNS sometimes fails for a few minutes: retry the package
      # installation instead of turning a transient mirror failure into a
      # broken release build.
      - name: Install git
        run: |
          for attempt in 1 2 3 4 5; do
            if apt-get update -qq -o Acquire::Retries=3 &&
              apt-get install -y -qq --no-install-recommends -o Acquire::Retries=3 ca-certificates git curl; then
              exit 0
            fi
            echo "Package install failed (attempt $attempt of 5), retrying in 30 seconds"
            sleep 30
          done
          exit 1

      - name: Check out source
        uses: actions/checkout@v7

      - name: Build and package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/build-release.sh --in-container --label "continuous-${GITHUB_SHA::12}" --output-dir dist

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: gextto-linux-${{ matrix.arch }}
          path: dist/gextto-linux-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error

      - name: Upload standalone gx-torrent archive
        uses: actions/upload-artifact@v7
        with:
          name: gx-torrent-linux-${{ matrix.arch }}
          path: dist/gx-torrent-linux-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error

      - name: Upload standalone gx-torrent for Windows
        uses: actions/upload-artifact@v7
        with:
          name: gx-torrent-windows-${{ matrix.arch }}
          path: dist/gx-torrent-windows-*.zip*
          if-no-files-found: error

  publish:
    name: publish continuous
    needs: [quality, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # release.json lists the recent commits as the in-app changelog.
          fetch-depth: 200

      - name: Download archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify and publish the complete draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/publish-github-release.sh \
            --channel continuous \
            --tag continuous \
            --label "continuous-${GITHUB_SHA::12}" \
            --dist dist \
            --repo "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA"
