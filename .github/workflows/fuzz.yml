name: Fuzz

# Fuzzing of every network-facing parser (make fuzz-smoke): the DHT, bencode,
# magnet, BEP 10/52, tracker, Torznab, RSS, MSE, the IP filter and the
# peer-wire handshake.
# Triggers, chosen so it never runs while someone is working on this machine:
#   - nightly (03:41 UTC), a 2m pass per target;
#   - on a push to main that touches an engine or parser path, a 30s pass (a
#     quick check, not a replacement for the nightly one);
#   - on demand from the Actions tab, with a custom per-target time.
# Kept off the general CI so a fuzzing failure does not block a merge. On a
# failure the Go fuzzer's crashing input (testdata/fuzz/<Target>/) is uploaded
# so it can be committed as a regression seed (docs/evoluzione.md section 6).

on:
  schedule:
    - cron: "41 3 * * *" # every night at 03:41 UTC
  push:
    branches: [main]
    paths:
      - "internal/gxcore/**"
      - "internal/dht/**"
      - "internal/utils/**"
      - "internal/rss/**"
      - "internal/torznab/**"
      - "cmd/gx-torrent/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:
    inputs:
      fuzz_time:
        description: "Fuzzing time per target (Go duration, e.g. 30s, 2m, 10m)"
        required: false
        default: "2m"

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz-smoke (x86_64)
    runs-on: ubuntu-24.04
    # Every target is pure Go: no C/C++ headers are needed.
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Manual runs use the input; the nightly uses 2m; an impactful push uses a
      # quick 30s pass.
      - name: Fuzz every network-facing parser
        run: make fuzz-smoke FUZZ_TIME=${{ github.event.inputs.fuzz_time || (github.event_name == 'schedule' && '2m' || '30s') }}

      # The Go fuzzer writes a crashing input to testdata/fuzz/<Target>/; keep it
      # so it can be fixed and committed as a seed.
      - name: Upload the failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
          retention-days: 30
