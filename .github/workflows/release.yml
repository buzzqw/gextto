name: Release Linux packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libtorrent-rasterbar-dev

      - name: Test
        run: make test

      - name: Test engine
        run: make test-engine

  # Built on Ubuntu 22.04 (glibc 2.35) so the archive runs on every supported
  # distribution. See scripts/build-release.sh.
  # Each architecture is built twice: the default pure Go archive and the
  # variant with the embedded libtorrent engine, published as
  # gextto-linux-<arch>-libtorrent.tar.gz.
  package:
    name: package (${{ matrix.arch }}, ${{ matrix.variant }})
    needs: test
    strategy:
      matrix:
        arch: [x86_64, aarch64]
        variant: [go, libtorrent]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - variant: go
            libtorrent: '0'
            suffix: ''
          - variant: libtorrent
            libtorrent: '1'
            suffix: '-libtorrent'
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates git curl

      - name: Check out source
        uses: actions/checkout@v7

      - name: Build and package
        env:
          GEXTTO_LIBTORRENT: ${{ matrix.libtorrent }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/build-release.sh --in-container --label "${GITHUB_REF_NAME}" --output-dir dist

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: gextto-linux-${{ matrix.arch }}${{ matrix.suffix }}
          path: dist/gextto-linux-${{ matrix.arch }}${{ matrix.suffix }}.tar.gz*
          if-no-files-found: error

      - name: Upload standalone gx-torrent archive
        if: matrix.variant == 'go'
        uses: actions/upload-artifact@v4
        with:
          name: gx-torrent-linux-${{ matrix.arch }}
          path: dist/gx-torrent-linux-${{ matrix.arch }}.tar.gz*
          if-no-files-found: error

  publish:
    name: publish release
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 200

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release manifest
        run: |
          scripts/release-manifest.sh --channel stable --label "${GITHUB_REF_NAME}" \
            --output dist/release.json

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/gextto-linux-*.tar.gz
            dist/gextto-linux-*.tar.gz.sha256
            dist/gx-torrent-linux-*.tar.gz
            dist/gx-torrent-linux-*.tar.gz.sha256
            dist/release.json
