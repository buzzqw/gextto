name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: vet and test (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libtorrent-rasterbar-dev

      - name: UI settings index
        run: make check-ui

      - name: Installer self-test
        run: make installer-test

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build
        env:
          GEXTTO_BUILD: ${{ github.run_number }}
        run: scripts/build-daemon.sh
