name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: vet and test (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: UI settings index
        run: make check-ui

      - name: Installer self-test
        run: make installer-test

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Test engine
        run: make test-engine

      - name: Build
        run: scripts/build-daemon.sh

      # The gx-core engine (internal/gxcore) and the standalone daemon are pure
      # Go and cross-compile to Windows; keep both that way (the platform
      # detail lives in cmd/gx-torrent/fsinfo_*.go).
      - name: Cross-build gx-core engine for Windows
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./internal/gxcore/...
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build ./internal/gxcore/...

      - name: Cross-build gx-torrent for Windows
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /dev/null ./cmd/gx-torrent/
          GOOS=windows GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null ./cmd/gx-torrent/

      # Vet compiles the Windows files of both the engine and the daemon (tests
      # included), catching platform-specific mistakes the linux vet cannot.
      - name: Vet for Windows
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./internal/gxcore/... ./cmd/gx-torrent/

      # The Windows package (exe + install-service.ps1 + README) must keep
      # building: it packs the daemon as a service installable with sc/New-Service.
      - name: Package gx-torrent for Windows
        run: |
          scripts/package-gx-torrent-windows.sh --arch amd64 --output /tmp/gx-torrent-windows-amd64.zip
          scripts/package-gx-torrent-windows.sh --arch arm64 --output /tmp/gx-torrent-windows-arm64.zip

  # The end-to-end UI suite (Playwright) drives the real SSR interface in a
  # browser: pages, mobile layout, i18n and the axe accessibility checks. Kept
  # separate from build-test because it needs Node and a browser.
  ui-e2e:
    name: UI end2end (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: uiweb/end2end/package-lock.json

      - name: Install the end2end dependencies
        working-directory: uiweb/end2end
        run: npm ci --no-audit --no-fund

      - name: Install the browser
        working-directory: uiweb/end2end
        run: npx playwright install --with-deps chrome

      - name: Build the daemon
        run: scripts/build-daemon.sh

      - name: Run the end2end suite
        working-directory: uiweb/end2end
        run: npx playwright test

  # The Win32 layer of the daemon (junctions, memory, gateway, storage class)
  # only cross-compiles on Linux; this job runs its tests on real Windows. The
  # rest of the suite assumes Unix paths, so only the platform tests run here.
  windows-platform:
    name: gx-torrent platform tests (Windows)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Platform tests
        env:
          CGO_ENABLED: "0"
        run: go test -run "Windows|MountPoint|Setup|CrossDevice|DaemonStart" ./cmd/gx-torrent/

  # Install gx-torrent as a real Windows service (New-Service, the same binPath
  # the packaged install-service.ps1 builds), start it, check it answers
  # /api/v1/health and stop it. Non-blocking: it needs administrator rights and
  # the Service Control Manager is asynchronous, so it can be flaky.
  windows-service:
    name: gx-torrent service install (Windows, non-blocking)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build the daemon
        shell: pwsh
        run: go build -o gx-torrent.exe ./cmd/gx-torrent

      - name: Service install/start/stop selftest
        shell: pwsh
        run: ./scripts/gx-torrent-service-selftest.ps1 -ExePath ./gx-torrent.exe

  # Phase 0 of the technical review: run the race detector as a separate,
  # non-blocking job. Its result is collected before it becomes required.
  race:
    name: race detector (x86_64, non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Race test
        run: make test-race

      - name: Race test (DHT module)
        run: cd internal/dht && CGO_ENABLED=1 go test -race ./...

  # Build the standalone container image and smoke-test it, so the Dockerfile
  # keeps working. Publishing is not done here (release.yml owns releases).
  container:
    name: container image (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build --build-arg GX_BUILD=0 -t gx-torrent:ci .

      - name: Smoke-test the image
        run: |
          docker run -d --name gx-torrent-ci -p 18080:8080 gx-torrent:ci
          code=""
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/ || true)
            [ "$code" = "303" ] && break
            sleep 1
          done
          docker logs gx-torrent-ci || true
          docker rm -f gx-torrent-ci
          [ "$code" = "303" ] || { echo "wizard redirect not seen (code=$code)"; exit 1; }

  # Build the full docker-full image too: it carries both gexttod and gx-torrent
  # and is the base of the compose stack documented in docs/DOCKER.*.md.
  container-full:
    name: full container image (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build the image
        run: |
          GEXTTO_SERIES="$(tr -d '[:space:]' < version_series)"
          GEXTTO_BUILD="$(tr -dc '0-9' < build_number)"
          GX_SERIES="$(tr -d '[:space:]' < gx_torrent.version_series 2>/dev/null || echo 1.1)"
          GX_BUILD="$(tr -dc '0-9' < gx-torrent.build_number)"
          docker build -f docker-full/Dockerfile \
            --build-arg GEXTTO_SERIES="$GEXTTO_SERIES" \
            --build-arg GEXTTO_BUILD="$GEXTTO_BUILD" \
            --build-arg GX_SERIES="$GX_SERIES" \
            --build-arg GX_BUILD="$GX_BUILD" \
            -t gextto-full:ci .

      - name: Smoke-test Gextto and the managed gx-torrent
        run: |
          mkdir -p /tmp/gextto-full-ci/{data,media,library}
          chmod -R 777 /tmp/gextto-full-ci
          docker run -d --name gextto-full-ci -p 15000:5000 \
            -v /tmp/gextto-full-ci/data:/data \
            -v /tmp/gextto-full-ci/media:/media \
            -v /tmp/gextto-full-ci/library:/library \
            gextto-full:ci
          code=""
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:15000/api/status || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          docker logs gextto-full-ci || true
          for _ in $(seq 1 30); do
            docker exec gextto-full-ci curl -fsS http://127.0.0.1:8890/api/v1/health >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec gextto-full-ci curl -fsS http://127.0.0.1:8890/api/v1/health >/dev/null
          docker rm -f gextto-full-ci
          [ "$code" = "200" ] || { echo "Gextto status not reachable (code=$code)"; exit 1; }
