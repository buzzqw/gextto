name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: vet and test (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libtorrent-rasterbar-dev

      - name: UI settings index
        run: make check-ui

      - name: Installer self-test
        run: make installer-test

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Test bundled rain fork
        run: make test-rain

      - name: Build
        run: scripts/build-daemon.sh

  # Phase 0 of the technical review: run the race detector as a separate,
  # non-blocking job. Its result is collected before it becomes required.
  race:
    name: race detector (x86_64, non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libtorrent-rasterbar-dev

      - name: Race test
        run: make test-race
