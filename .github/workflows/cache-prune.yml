name: Cache prune

# GitHub Actions has no built-in "keep the last N caches" policy: caches live
# until the repository budget (10 GB) is exceeded, then the least recently used
# are evicted — which on this repository can discard the useful Go/npm caches
# before the CodeQL overlay base databases (one per commit, ~75 MB each) that
# fill most of the budget. This job runs the pruning script and keeps only the
# newest `keep` caches of every kind.
#
# Manual run: Actions → Cache prune → Run workflow (optionally set how many to
# keep). Requires no secrets beyond the automatic GITHUB_TOKEN.

on:
  schedule:
    - cron: "23 4 * * *" # every day at 04:23 UTC
  workflow_dispatch:
    inputs:
      keep:
        description: "How many recent caches of each kind to keep"
        required: false
        default: "20"

permissions:
  contents: read
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Prune old caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP: ${{ github.event.inputs.keep || '20' }}
        run: ./scripts/prune-actions-caches.sh --keep "$KEEP"
