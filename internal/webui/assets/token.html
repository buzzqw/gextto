<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>gx-torrent</title><meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href="/favicon.ico">
<script>try{var m=localStorage.getItem('gx-theme');if(m==='light'||m==='dark')document.documentElement.setAttribute('data-theme',m);}catch(e){}</script>
<link rel="stylesheet" href="/assets/theme.css">
<style>
body{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:72px 16px}
form{width:min(380px,100%);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
form h2{margin:0;display:flex;align-items:center;gap:10px;font-size:18px}
form h2::before{content:"";width:28px;height:28px;border-radius:7px;background:url(/favicon.ico) center/cover}
input{width:100%}
button{width:100%;height:38px}
button[type=submit]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.m{color:var(--muted);margin:0}
</style></head>
<body><form method="get" action="/">
<h2 style="margin:0 0 6px">gx-torrent</h2>
<p class="m">This instance requires the token configured in Gextto.</p>
<input type="password" name="token" placeholder="token" autofocus autocomplete="off">
<button type="submit">Sign in</button>
</form><script src="/assets/common.js"></script>
</body></html>
