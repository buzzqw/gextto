  "Attiva log dettagliati e diagnostiche periodiche per il debug.": "Aktiviert ausführliche Protokolle und regelmäßige Diagnosen zur Fehlersuche."
  "Attiva o disattiva il daemon Gextto: cicli automatici e download.": "Schaltet den Gextto-Dienst ein oder aus: automatische Zyklen und Downloads."
  "Attivo: a fine seed il torrent completato viene tolto dalla sessione (come «Pulisci completati»). Spento: a fine seed il torrent resta nell'elenco come Completato e lo rimuovi tu con «Pulisci completati». Non influisce su dove vengono spostati i file.": "An: Nach dem Seeden wird der fertige Torrent aus der Sitzung entfernt (wie «Fertige bereinigen»). Aus: Er bleibt als Fertig in der Liste und Sie entfernen ihn mit «Fertige bereinigen». Hat keinen Einfluss darauf, wohin Dateien verschoben werden."
  "Attivo: al termine del seed la sorgente scaricata viene eliminata (il file resta in libreria). Spento: la sorgente scaricata viene copiata in libreria e mantenuta.": "An: Nach dem Seeden wird die heruntergeladene Quelle gelöscht (die Datei bleibt in der Bibliothek). Aus: Die Quelle wird in die Bibliothek kopiert und behalten."
