  Se nessuno è selezionato, lo scheduler è attivo tutti i giorni.: Wenn keiner ausgewählt ist, ist der Scheduler jeden Tag aktiv.
  ? Se specificato, filtra i torrent per anno (±1 anno di tolleranza per accettare rilasci ritardati in home video). Lascia vuoto per ignorare
