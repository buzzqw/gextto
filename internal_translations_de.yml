  "Associa un tag del torrent a una cartella temporanea e finale.": "Ordnet einem Torrent-Tag einen temporären und einen endgültigen Ordner zu."
  "Attiva l'autogestione di gx-torrent: coda dinamica e cache adattiva (dimensionata su memoria disponibile, download/seed attivi e tipo di storage). Predefinito attivo. Disattivalo per fissare a mano cache e slot.": "Aktiviert die Selbstverwaltung von gx-torrent: dynamische Warteschlange und adaptiver Cache (bemessen nach freiem Speicher, aktiven Downloads/Seeds und Speichertyp). Standardmäßig an. Ausschalten, um Cache und Slots manuell festzulegen."
