  Se impostato su Sì, i nuovi magnet inviati da Extto rimarranno fermi in attesa di un tuo avvio manuale.: Wenn auf Ja gesetzt, bleiben die von
    Extto gesendeten neuen Magnets angehalten, bis Sie sie manuell starten.
  ? Se indicata, salva i file parziali su un disco separato (es. NVMe) spostandoli solo a completamento per evitare usura meccanica. Lascia vuoto
    per disabilitare.
  : Wenn angegeben, speichert unvollständige Dateien auf einer separaten Festplatte (z. B. NVMe) und verschiebt sie erst nach Abschluss, um mechanischen
    Verschleiß zu vermeiden. Leer lassen, um zu deaktivieren.
  Se le porte non funzionano: Wenn die Ports nicht funktionieren
  Se nei torrent usano un nome diverso da quello ufficiale TMDB, scrivilo qui per forzare il riconoscimento.: Wenn sie in Torrents einen anderen
