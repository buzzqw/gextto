  "Se un download è fermo da almeno questi minuti — a 0 B/s oppure ancora in attesa del suo elenco di file (metadati, tipico dei magnet morti) — la ricerca può avviare una versione alternativa della stessa puntata o film. Il download fermo resta in sessione e può riprendersi; la deduplica dell'archivio terrà poi la copia migliore. 0 disattiva.": "Wenn ein Download mindestens so viele Minuten hängt — bei 0 B/s oder noch wartend auf seine Dateiliste (Metadaten, typisch für tote Magnete) — kann die Suche eine alternative Version derselben Folge oder desselben Films starten. Der hängende Download bleibt in der Sitzung und kann sich noch erholen; die Archiv-Deduplizierung behält dann die beste Kopie. 0 deaktiviert."
  "Quanti punti di punteggio in meno sono accettati per l'alternativa rispetto alla release bloccata. Il download bloccato non viene rimosso: parte solo un'alternativa adeguata (non una versione scadente). 0 disattiva.": "Um wie viele Punkte die Alternative unter der hängenden Release liegen darf. Der hängende Download wird nicht entfernt: es wird nur eine angemessene Alternative gestartet (keine schlechte Version). 0 deaktiviert."
