  ? 'Quando attiva, il sistema regola da solo Max download attivi, Max upload attivi e Max totali (qui sopra, che diventano solo il punto di partenza
    a ogni riavvio del ciclo ~2h — i campi si disabilitano). Max download attivi si muove tra Minimo e Massimo qui sotto, in base a quanta della
    banda che HAI impostato (Limite download) viene davvero usata — non una banda ''reale'' misurata, ma il tuo tetto configurato: sopra il 90%
    per un po'' riduce gli slot (aggiungerne altri diluirebbe solo la banda), sotto il 50% con torrent in coda con fonti reali non sfruttate li
    aumenta. Max upload attivi scende a 1 quando c''è un download vicino al completamento in corso (il seeding può aspettare) e torna al valore
    configurato quando finisce. Max totali si adatta di conseguenza per non diventare lui stesso il collo di bottiglia. Assegna anche più connessioni,
    slot upload e banda ai singoli torrent più vicini al completamento o con più fonti (peer/seed) rispetto a quelli lenti o senza fonti. Se disattivata,
    tutto torna ai tre valori statici configurati sopra.'
  : 'Wenn es aktiv ist, passt sich das System selbst an: Max. aktive Downloads, Max. aktive Uploads und Max. Gesamtwerte (oben, die nur bei jedem
    Neustart des ~2-Stunden-Zyklus zum Ausgangspunkt werden – die Felder sind deaktiviert). Die maximale Anzahl aktiver Downloads bewegt sich
    unten zwischen Minimum und Maximum, je nachdem, wie viel der Bandbreite, die Sie eingestellt haben (Download-Limit), tatsächlich verwendet
    wird – keine gemessene „echte“ Bandbreite, sondern Ihre konfigurierte Obergrenze: Über 90 % für eine Weile werden die Slots reduziert (das
    Hinzufügen von mehr würde nur die Bandbreite verwässern), unter 50 % mit Torrents, die mit echten ungenutzten Quellen in der Warteschlange
    stehen, werden sie erhöht. Die maximale Anzahl aktiver Uploads sinkt auf 1, wenn ein nahezu vollständiger Download läuft (das Seeding kann
    warten) und kehrt nach Abschluss zum konfigurierten Wert zurück. Max Totals passt sich entsprechend an, um nicht selbst zum Flaschenhals zu
    werden. Außerdem weist es einzelnen Torrents, die näher an der Fertigstellung sind oder über mehr Quellen (Peer/Seed) verfügen, mehr Verbindungen,
    Upload-Slots und Bandbreite zu als denen, die langsam sind oder keine Quellen haben. Bei Deaktivierung wird alles auf die drei oben konfigurierten
    statischen Werte zurückgesetzt.'
