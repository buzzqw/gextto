  "Controlla gli aggiornamenti": "Nach Updates suchen"
  "Aggiornamenti": "Updates"
  "Ogni 6 ore scarica da GitHub le informazioni sull'ultima versione e, se ce n'è una nuova, mostra «Aggiornamento disponibile». Non invia dati e non aggiorna da solo: l'aggiornamento parte solo da Manutenzione.": "Lädt alle 6 Stunden die Informationen zur neuesten Version von GitHub und zeigt bei einer neuen Version «Update verfügbar». Es werden keine Daten gesendet und nie automatisch aktualisiert: Das Update startet nur über Wartung."
  "Nuova versione disponibile: apri Manutenzione": "Neue Version verfügbar: Wartung öffnen"
  "Installazione da sorgenti: aggiorna con git pull e make build.": "Aus dem Quellcode installiert: mit git pull und make build aktualisieren."
  "Aggiornamento in corso: Gextto attende la fine delle copie verso la libreria, poi si riavvia. Questo pannello si aggiorna da solo.": "Update läuft: Gextto wartet, bis die Kopien in die Bibliothek fertig sind, und startet dann neu. Dieses Panel aktualisiert sich selbst."
  "Nuova versione": "Neue Version"
  "Novità rispetto alla versione installata:": "Änderungen seit der installierten Version:"
  "Elenco parziale: la versione installata è più vecchia delle modifiche mostrate.": "Unvollständige Liste: Die installierte Version ist älter als die angezeigten Änderungen."
  "Prima di aggiornare viene creato un backup dei database. Se la nuova versione non parte, torna automaticamente quella precedente.": "Vor dem Update wird eine Sicherung der Datenbanken erstellt. Startet die neue Version nicht, wird automatisch die vorherige wiederhergestellt."
  "Aggiornamento dalla UI non configurato: riesegui l'installer (install.sh) per abilitarlo, oppure usa sudo gexttod --update.": "Updates über die Oberfläche sind nicht eingerichtet: Installer (install.sh) erneut ausführen oder sudo gexttod --update verwenden."
  "Gextto è all'ultima versione disponibile.": "Gextto ist auf der neuesten verfügbaren Version."
  "Controllo aggiornamenti non riuscito:": "Update-Prüfung fehlgeschlagen:"
