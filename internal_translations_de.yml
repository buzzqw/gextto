  "Intervallo minimo in millisecondi tra due letture dello stato dei torrent (250–60000, predefinito 1500). La coda è gestita da gx-torrent stesso, non dipende da questo valore.": "Mindestintervall in Millisekunden zwischen zwei Statusabfragen (250–60000, Standard 1500). Die Warteschlange verwaltet gx-torrent selbst, sie hängt nicht von diesem Wert ab."
  "Intervallo tra due housekeeping automatici, in ore.": "Intervall zwischen zwei automatischen Aufräumläufen, in Stunden."
