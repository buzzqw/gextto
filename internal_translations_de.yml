    Endpunkt /api/trakt/scrobble als gesehen auf Trakt markiert werden
  ? Se abilitato, quando arriva una versione di qualità superiore i file precedenti vengono spostati in trash. Se arriva una versione peggiore
    di una già esistente, viene scartata direttamente in trash.
  : Wenn aktiviert, werden vorherige Dateien in den Papierkorb verschoben, wenn eine qualitativ hochwertigere Version ankommt. Wenn eine schlechtere
    Version als eine bereits vorhandene ankommt, wird sie direkt in den Papierkorb verworfen.
  Se attivo, interrompe il torrent una volta raggiunto il target (vedi sotto). Evita il seed all'infinito.: Wenn aktiviert, wird der Torrent gestoppt,
    sobald das Ziel erreicht ist (siehe unten). Verhindert unendliches Seeden.
  Se disattivato, il torrent viene aggiunto in pausa e non parte finché non lo riprendi: Wenn die Funktion deaktiviert ist, wird der Torrent angehalten
    und erst dann gestartet, wenn Sie ihn fortsetzen
  Se disattivo, una release migliore non sostituirà mai il file già archiviato per questa serie: Wenn diese Option deaktiviert ist, ersetzt eine
    bessere Version niemals die bereits für diese Serie archivierte Datei
  Se disattivo, una release migliore non sostituirà mai il file già archiviato per questo film: Wenn ich dies ausschalte, wird die für diesen
