    vorhandenen Torrents zu verwalten.
  ? Se abilitato, EXTTO scarica i torrent piccoli direttamente in RAM (tmpfs) invece che su disco. Al completamento li sposta nella cartella definitiva.
    Richiede un tmpfs montato dall'utente in /etc/fstab.
  : Wenn aktiviert, lädt EXTTO kleine Torrents direkt in den RAM (tmpfs) anstatt auf die Festplatte herunter. Nach Abschluss werden sie in den
    endgültigen Ordner verschoben. Erfordert ein vom Benutzer in /etc/fstab gemountetes tmpfs.
  Se abilitato, permette di segnare episodi come visti su Trakt: Wenn aktiviert, können Episoden über /api/trakt/scrobble als gesehen auf Trakt
