    Per le serie TV il controllo è stringente; per i film, una release senza lingua richiesta finisce comunque nel feed \'
  : 'PFLICHTANFORDERUNG: EXTTO lädt nur Releases herunter, die diese Audiosprache im Titel enthalten. Releases ohne diese Sprache werden verworfen.
    Bei TV-Serien ist die Prüfung streng; bei Filmen landet ein Release ohne die gewünschte Sprache trotzdem im Feed \'
  ? 'Requisito PREFERENZIALE (non obbligatorio): non filtra né scarta. Ogni lingua sub trovata nel titolo aggiunge +200 punti allo score, alzando
    la priorità di quel torrent nel confronto tra candidati. Con più lingue (es. Italiano + Inglese): +200 se trovato solo uno, +400 se trovati
    entrambi. Il torrent con più lingue sub vince a parità di qualità. Valido sia per serie TV che per film.'
  : 'BEVORZUGTE Anforderung (nicht zwingend): filtert oder verwirft nicht. Jede im Titel gefundene Untertitelsprache fügt dem Score +200 Punkte
    hinzu, was die Priorität dieses Torrents beim Vergleich der Kandidaten erhöht. Bei mehreren Sprachen (z. B. Deutsch + Englisch): +200, wenn
    nur eine gefunden wird, +400, wenn beide gefunden werden. Der Torrent mit mehr Untertitelsprachen gewinnt bei gleicher Qualität. Gilt für
    TV-Serien und Filme.'
