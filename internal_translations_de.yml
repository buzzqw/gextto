  "Killswitch VPN: interfaccia usata per tutto il traffico BitTorrent in uscita.": "VPN-Killswitch: Schnittstelle für den gesamten ausgehenden BitTorrent-Verkehr."
  "L'URL o il file si impostano nei campi «IP filter» qui nella scheda; con un URL Gextto lo scarica e lo applica. Funziona anche con gx-torrent.": "URL oder Datei werden in den Feldern «IP filter» dieses Bereichs gesetzt; bei einer URL lädt Gextto sie und wendet sie an. Funktioniert auch mit gx-torrent."
  "Le release che contengono queste parole o script (es. [non-latino], [porno]) vengono escluse. Le modifiche si salvano subito.": "Releases mit diesen Wörtern oder Schriften (z. B. [non-latino], [porno]) werden ausgeschlossen. Änderungen werden sofort gespeichert."
