  "Anime (numerazione assoluta)": "Anime (absolute Nummerierung)"
  "Niente upgrade": "Keine Upgrades"
  "Le release degli anime numerano gli episodi dall'inizio senza stagioni («Titolo - 1071»): Gextto converte il numero in stagione ed episodio con i dati TMDB e cerca anche il numero assoluto.": "Anime-Releases nummerieren Episoden ab Beginn ohne Staffeln („Titel - 1071“): Gextto rechnet die Nummer mit TMDB-Daten in Staffel und Episode um und sucht auch nach der absoluten Nummer."
  "Una release migliore non sostituisce più un file già archiviato di questa serie.": "Ein besseres Release ersetzt keine bereits archivierte Datei dieser Serie mehr."
  "Download in corso": "Laufende Downloads"
  "Attivo: un file che resta in seed entra in libreria come hardlink, cioè un secondo nome per gli stessi dati, senza occupare spazio due volte. Cancellare uno dei due nomi non tocca l'altro. Funziona solo se download e libreria sono sullo stesso filesystem; altrimenti gextto copia come prima.": "An: Eine Datei, die weiter geseedet wird, kommt als Hardlink in die Bibliothek, also als zweiter Name für dieselben Daten, ohne doppelten Platz zu belegen. Das Löschen eines der beiden Namen berührt den anderen nicht. Funktioniert nur, wenn Downloads und Bibliothek auf demselben Dateisystem liegen; sonst kopiert gextto wie bisher."
  "Solo se Jellyfin vede la libreria con percorsi diversi (es. Docker): una riga per cartella, percorso_gextto=percorso_jellyfin. Serve per chiedere a Jellyfin di aggiornare solo la cartella appena cambiata.": "Nur wenn Jellyfin die Bibliothek unter anderen Pfaden sieht (z. B. Docker): eine Zeile pro Ordner, gextto_pfad=jellyfin_pfad. Damit wird Jellyfin gebeten, nur den gerade geänderten Ordner zu aktualisieren."
  "Solo se Plex vede la libreria con percorsi diversi (es. Docker): una riga per cartella, percorso_gextto=percorso_plex. Serve per chiedere a Plex di aggiornare solo la cartella appena cambiata.": "Nur wenn Plex die Bibliothek unter anderen Pfaden sieht (z. B. Docker): eine Zeile pro Ordner, gextto_pfad=plex_pfad. Damit wird Plex gebeten, nur den gerade geänderten Ordner zu aktualisieren."
  "Quando il file in libreria ha almeno questo punteggio non si cercano più miglioramenti; resta accettato solo un REPACK o PROPER che corregge una release difettosa. Riferimenti: 1080p WEB-DL H.264 ≈ 1280, 1080p WEB-DL H.265 DD+ ≈ 1480, 2160p ≈ 2480. 0 = migliora sempre. Per fermare del tutto gli upgrade di un solo titolo usa «Niente upgrade» nella sua scheda.": "Hat die Datei in der Bibliothek mindestens diese Punktzahl, wird nicht mehr nach Verbesserungen gesucht; nur ein REPACK oder PROPER, das ein fehlerhaftes Release korrigiert, wird noch angenommen. Richtwerte: 1080p WEB-DL H.264 ≈ 1280, 1080p WEB-DL H.265 DD+ ≈ 1480, 2160p ≈ 2480. 0 = immer verbessern. Um Upgrades für einen einzelnen Titel zu stoppen, „Keine Upgrades“ auf seiner Seite verwenden."
  "Spento (predefinito): chiunque raggiunga gextto lo usa, come in una LAN fidata. Acceso: chi non è in rete locale deve fare il login o usare la chiave API. Resta aperto finché non imposti una password o una chiave. Se resti chiuso fuori, avvia gextto con GEXTTO_AUTH_DISABLE=1.": "Aus (Standard): Jeder, der gextto erreicht, kann es nutzen, wie in einem vertrauenswürdigen LAN. An: Wer nicht im lokalen Netz ist, muss sich anmelden oder den API-Schlüssel verwenden. Bleibt offen, bis ein Passwort oder ein Schlüssel gesetzt ist. Wer sich ausgesperrt hat, startet gextto mit GEXTTO_AUTH_DISABLE=1."
  "Acceso (predefinito): dalla rete di casa (127.0.0.1, 192.168.x.x, 10.x.x.x, 172.16-31.x.x) non serve il login. Dietro un reverse proxy conta l'indirizzo reale del client inoltrato dal proxy.": "An (Standard): Aus dem Heimnetz (127.0.0.1, 192.168.x.x, 10.x.x.x, 172.16-31.x.x) ist keine Anmeldung nötig. Hinter einem Reverse Proxy zählt die vom Proxy weitergeleitete echte Client-Adresse."
  "Nome utente per il login (predefinito admin).": "Benutzername für die Anmeldung (Standard admin)."
  "Password per il login. Viene salvata solo come hash; lascia vuoto per non cambiarla.": "Passwort für die Anmeldung. Wird nur als Hash gespeichert; leer lassen, um es nicht zu ändern."
  "Chiave per script, TUI (variabile GEXTTO_API_KEY) e calendario iCal: header X-Api-Key oppure ?apikey= nell'indirizzo. Scegli una stringa lunga e casuale.": "Schlüssel für Skripte, die TUI (Variable GEXTTO_API_KEY) und den iCal-Kalender: Header X-Api-Key oder ?apikey= in der Adresse. Eine lange, zufällige Zeichenfolge wählen."
