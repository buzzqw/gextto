  "L'interfaccia ascolta su tutta la rete. Una password impedisce a chiunque altro di cambiare la configurazione o avviare download. Dalla rete locale puoi lasciare l'accesso libero.": "Die Oberfläche lauscht im ganzen Netzwerk. Ein Passwort verhindert, dass andere die Konfiguration ändern oder Downloads starten. Aus dem lokalen Netz kann der Zugang offen bleiben."
  "Proteggi l'accesso con una password": "Zugang mit einem Passwort schützen"
