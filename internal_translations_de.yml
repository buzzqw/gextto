  "Gextto scarica da sé l'ultima release di qBittorrent-nox, la installa nella cartella dell'applicazione (accanto a gexttod), la avvia e la ferma con il servizio e la aggiorna (con backup e rollback). Il motore in uso però si sceglie dalla voce «Motore torrent»: questa opzione non lo cambia.": "Gextto lädt selbst die neueste qBittorrent-nox-Version, installiert sie im Programmordner (neben gexttod), startet und stoppt sie mit dem Dienst und aktualisiert sie (mit Backup und Rollback). Der verwendete Client wird aber unter «Torrent-Client» gewählt: Diese Option ändert ihn nicht."
  "Giapponese": "Japanisch"
  "Giorni di conservazione per le pulizie non forzate; 0 elimina tutto il contenuto del cestino. Le azioni manuali della UI svuotano sempre subito il cestino.": "Aufbewahrungstage für nicht erzwungene Bereinigungen; 0 löscht den gesamten Papierkorb. Manuelle Aktionen in der Oberfläche leeren ihn immer sofort."
  "Gruppi custom": "Eigene Gruppen"
  "I filtri selezionati sopra impediscono di archiviare nuove release corrispondenti. Non cancellano retroattivamente le voci esistenti: qui puoi trovarle e rimuoverle singolarmente, selezionate o tutte insieme. La ricerca usa gli stessi filtri attivi; modificali e salvali sopra per cambiare i contenuti da trovare.": "Die oben gewählten Filter verhindern, dass neue passende Releases archiviert werden. Bestehende Einträge löschen sie nicht rückwirkend: Hier können Sie sie finden und einzeln, ausgewählt oder alle zusammen entfernen. Die Suche nutzt dieselben aktiven Filter; ändern und speichern Sie sie oben, um die Treffer zu ändern."
  "I torrent che non trasferiscono dati non consumano uno slot attivo.": "Torrents ohne Datenübertragung belegen keinen aktiven Slot."
  "Ignora le release più vecchie di N giorni (0 = nessun limite). Le release senza data sono considerate pubblicate oggi.": "Ignoriert Releases, die älter als N Tage sind (0 = keine Grenze). Releases ohne Datum gelten als heute veröffentlicht."
  "Il nome deve corrispondere al tag finale della release (es. TBK). Il punteggio viene sommato allo score tecnico; sono ammessi anche valori negativi.": "Der Name muss dem letzten Tag des Releases entsprechen (z. B. TBK). Die Punktzahl wird zur technischen Wertung addiert; negative Werte sind erlaubt."
  "Impostazioni libtorrent avanzate, una per riga nel formato chiave=valore.": "Erweiterte libtorrent-Einstellungen, eine pro Zeile als Schlüssel=Wert."
  "Indica dove libtorrent accetta connessioni: 0.0.0.0:6881-6891 per tutte le interfacce, 127.0.0.1:6881 solo in locale, oppure wg0:6881/tun0:6881 per una VPN. Il valore proposto va bene nella maggior parte dei casi.": "Wo libtorrent Verbindungen annimmt: 0.0.0.0:6881-6891 für alle Schnittstellen, 127.0.0.1:6881 nur lokal oder wg0:6881/tun0:6881 für ein VPN. Der vorgeschlagene Wert passt meistens."
  "Indirizzo di ascolto del demone. Predefinito 127.0.0.1:8890, cioè solo questo server: pagina web e API non escono in LAN. Per esporle in LAN usa 0.0.0.0:8890 e imposta gxtorrent_token (senza token Gextto avvia il demone in -insecure e lo segnala nel log). Il traffico peer usa sempre la porta singola/le libtorrent_port_*.": "Lausch-Adresse des Daemons. Standard 127.0.0.1:8890, also nur dieser Server: Webseite und API bleiben außerhalb des LAN. Um sie im LAN freizugeben, verwende 0.0.0.0:8890 und setze gxtorrent_token (ohne Token startet Gextto den Daemon mit -insecure und protokolliert es). Der Peer-Verkehr nutzt immer den einzelnen Port/libtorrent_port_*."
