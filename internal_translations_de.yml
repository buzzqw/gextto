  "Se Sì, un film arrivato dentro una cartella torrent viene spostato nella cartella film come file singolo, portando con sé sottotitoli e artwork. Se No, resta nella sua cartella.": "Bei Ja wird ein Film aus einem Torrent-Ordner als Einzeldatei samt Untertiteln und Artwork in den Filmordner verschoben. Bei Nein bleibt er in seinem Ordner."
  "Se una release raggiunge almeno questo punteggio, ignora il delay configurato.": "Erreicht ein Release mindestens diese Punktzahl, wird die Verzögerung übersprungen."
  "Segreto condiviso con gx-torrent (header X-Gx-Token). Facoltativo se gx-torrent ascolta solo su 127.0.0.1; obbligatorio se lo esponi in rete. Non visualizzato.": "Mit gx-torrent geteiltes Geheimnis (Header X-Gx-Token). Optional, wenn gx-torrent nur auf 127.0.0.1 lauscht; Pflicht, wenn er im Netzwerk erreichbar ist. Nicht angezeigt."
