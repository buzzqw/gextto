    in Health zeigt stattdessen die allgemeine Kontrolle der Quellen.
  ? 'Questo pannello serve a fare una copia o una modifica avanzata delle traduzioni dell''interfaccia. Scegli una lingua e premi Esporta per
    caricare nell''editor le coppie chiave/valore salvate; modifica il testo YAML e premi Importa per aggiornare o aggiungere le traduzioni. Le
    chiavi non presenti nel file importato non vengono cancellate. Esempio: "Testa porte": "Test ports". Dopo l''importazione l''interfaccia si
    aggiorna automaticamente se hai importato la lingua attiva; altrimenti selezionala dal menu in alto.'
  : 'In diesem Bereich können Sie eine Kopie oder eine erweiterte Änderung der Schnittstellenübersetzungen erstellen. Wählen Sie eine Sprache
    und klicken Sie auf „Exportieren“, um die gespeicherten Schlüssel/Wert-Paare in den Editor zu laden; Bearbeiten Sie den YAML-Text und klicken
    Sie auf „Importieren“, um Übersetzungen zu aktualisieren oder hinzuzufügen. Schlüssel, die in der importierten Datei nicht vorhanden sind,
    werden nicht gelöscht. Beispiel: „Testports“: „Testports“. Nach dem Import aktualisiert sich die Benutzeroberfläche automatisch, wenn Sie
    die aktive Sprache importiert haben; andernfalls wählen Sie es aus dem Menü oben aus.'
