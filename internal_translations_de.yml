  "Gextto cerca le release negli indexer di Prowlarr o Jackett e prende titoli, stagioni, episodi, locandine e calendario da TMDB (consigliato) oppure da TVDB. Basta una delle due chiavi: se ci sono entrambe vince TMDB. Puoi aggiungere altro dopo, in Impostazioni.": "Gextto sucht Releases in den Prowlarr- oder Jackett-Indexern und bezieht Titel, Staffeln, Episoden, Poster und Kalender von TMDB (empfohlen) oder von TVDB. Einer der beiden Schlüssel genügt: Sind beide gesetzt, hat TMDB Vorrang. Weiteres kannst du später in den Einstellungen hinzufügen."
