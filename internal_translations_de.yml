  "Le operazioni coinvolgono tutti i database SQLite (serie, archivio, configurazione e fumetti): VACUUM compatta i file, ANALYZE aggiorna le statistiche e Verifica controlla integrità, chiavi esterne e indici (compreso FTS dell’archivio), senza modificare dati.": "Die Vorgänge betreffen alle SQLite-Datenbanken (TV-Serien, Archiv, Konfiguration und Comics): VACUUM komprimiert die Dateien, ANALYZE aktualisiert die Statistiken und Prüfen kontrolliert Integrität, Fremdschlüssel und Indizes (einschließlich FTS des Archivs), ohne Daten zu verändern."
