  : Gextto überprüft diese Ordner alle 15 Sekunden und fügt die dort kopierten .torrent- und .magnet-Dateien hinzu. Nach erfolgreichem Hinzufügen
    wird die Datei entfernt (oder in .imported umbenannt, wenn „Entfernen nach“ deaktiviert ist).
  ? Gextto mostra i tmpfs/ramfs disponibili. Se non ne hai uno configurato puoi creare /dev/shm/gextto; il contenuto di /dev/shm non sopravvive
    al riavvio della macchina.
  : Gextto zeigt verfügbare tmpfs/ramfs. Wenn Sie noch keines konfiguriert haben, können Sie /dev/shm/gextto erstellen; Der Inhalt von /dev/shm
    überlebt einen Neustart der Maschine nicht.
  ? Gextto mostra i tmpfs/ramfs disponibili. Se non ne hai uno configurato puoi creare /dev/shm/gextto; scegliendo un percorso vengono proposti
    automaticamente dimensione massima e margine in base allo spazio reale. Il contenuto di /dev/shm non sopravvive al riavvio della macchina.
  : Gextto zeigt verfügbare tmpfs/ramfs. Wenn Sie noch keines konfiguriert haben, können Sie /dev/shm/gextto erstellen; Durch die Auswahl eines
    Pfads werden automatisch maximale Größe und Rand basierend auf dem realen Raum vorgeschlagen. Der Inhalt von /dev/shm überlebt einen Neustart
    der Maschine nicht.
  ? 'Gextto non scarica mai un episodio più vecchio fuori dai buchi riconosciuti quando possiede già episodi successivi: è una regola fissa, non
    disattivabile. Un vero upgrade di qualità resta permesso, e gap-fill e azioni manuali passano sempre.'
  : 'Gextto lädt niemals eine ältere Episode außerhalb der erkannten Lücken herunter, wenn bereits Folgeepisoden vorhanden sind: Dies ist eine
    feste Regel, die nicht deaktiviert werden kann. Eine echte Qualitätssteigerung bleibt zulässig, Lückenfüllungen und manuelle Eingriffe bleiben
    stets bestehen.'
