  ? 'Quando attiva, il sistema regola da solo Max download attivi, Max upload attivi e Max totali (qui sopra, che diventano solo il punto di partenza
    a ogni riavvio del ciclo ~2h — i campi si disabilitano). Max download attivi si muove tra Minimo e Massimo qui sotto, in base a quanta della
    banda che HAI impostato (Limite download) viene davvero usata — non una banda ''reale'' misurata, ma il tuo tetto configurato: sopra il 90%
    per un po'' riduce gli slot (aggiungerne altri diluirebbe solo la banda), sotto il 50% con torrent in coda con fonti reali non sfruttate li
    aumenta. Max upload attivi scende a 1 quando c''è un download vicino al completamento in corso (il seeding può aspettare) e torna al valore
    configurato quando finisce. Max totali si adatta di conseguenza per non diventare lui stesso il collo di bottiglia. Assegna anche più connessioni,
    slot upload e banda ai singoli torrent più vicini al completamento o con più fonti (peer/seed) rispetto a quelli lenti o senza fonti. Se disattivata,
    tutto torna ai tre valori statici configurati sopra.'
  : 'Lorsqu''il est actif, le système ajuste lui-même Max active downloads, Max active uploads et Max totaux (ci-dessus, qui ne deviennent le
    point de départ qu''à chaque redémarrage du cycle de ~2h — les champs sont désactivés). Le nombre maximum de téléchargements actifs se déplace
    entre le minimum et le maximum ci-dessous, en fonction de la quantité de bande passante que vous avez définie (limite de téléchargement) qui
    est réellement utilisée – pas une bande passante « réelle » mesurée, mais votre plafond configuré : au-dessus de 90 % pendant un certain temps
    réduit les emplacements (en ajouter davantage ne ferait que diluer la bande passante), en dessous de 50 % avec des torrents mis en file d''attente
    avec de vraies sources inexploitées, les augmente. Le nombre maximal de téléchargements actifs tombe à 1 lorsqu''un téléchargement est presque
    terminé en cours (l''amorçage peut attendre) et revient à la valeur configurée une fois celui-ci terminé. Les totaux maximum s''adaptent en
    conséquence afin de ne pas devenir lui-même le goulot d''étranglement. Il attribue également plus de connexions, d''emplacements de téléchargement
    et de bande passante aux torrents individuels qui sont plus proches de leur achèvement ou avec plus de sources (peer/seed) qu''à ceux qui
    sont lents ou n''ont pas de sources. S''il est désactivé, tout revient aux trois valeurs statiques configurées ci-dessus.'
