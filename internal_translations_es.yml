  "Con la velocità su Auto misura la latenza verso Google e Cloudflare e alza download e upload finché il ping resta buono; quando sale, taglia il limite. Con «both» i contatori del router restano solo un'informazione; con «ping» il router non viene proprio letto, quindi non può sbagliare.": "Con la velocidad en Auto mide la latencia hacia Google y Cloudflare y sube la descarga y la subida mientras el ping sigue bien; cuando sube, recorta el límite. Con «both» los contadores del router son solo información; con «ping» el router no se lee en absoluto, así que no puede equivocarse."
  "Cosa guida il limite di Auto: «both» = ping Google/Cloudflare (decide) + router (solo diagnostica); «ping» = solo ping, il router è ignorato; «router» = vecchio comportamento, si cede solo agli altri dispositivi visti dal router.": "Qué guía el límite de Auto: «both» = ping Google/Cloudflare (decide) + router (solo diagnóstico); «ping» = solo ping, el router se ignora; «router» = comportamiento antiguo, ceder solo a los otros dispositivos que ve el router."
  "Host (o host:porta) a cui misurare la latenza con una connessione TCP ogni 2 secondi, solo mentre Auto è attivo. Vuoto = Google (8.8.8.8, 8.8.4.4) e Cloudflare (1.1.1.1, 1.0.0.1); si usa il tempo più basso, così un server lontano o lento non falsa la misura.": "Host (o host:puerto) al que medir la latencia con una conexión TCP cada 2 segundos, solo mientras Auto está activo. Vacío = Google (8.8.8.8, 8.8.4.4) y Cloudflare (1.1.1.1, 1.0.0.1); se usa el tiempo más bajo, así un servidor lejano o lento no falsea la medición."
  "Auto — cosa misura la latenza": "Auto — qué mide la latencia"
