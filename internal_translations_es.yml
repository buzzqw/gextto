  ? 'Quando attiva, il sistema regola da solo Max download attivi, Max upload attivi e Max totali (qui sopra, che diventano solo il punto di partenza
    a ogni riavvio del ciclo ~2h — i campi si disabilitano). Max download attivi si muove tra Minimo e Massimo qui sotto, in base a quanta della
    banda che HAI impostato (Limite download) viene davvero usata — non una banda ''reale'' misurata, ma il tuo tetto configurato: sopra il 90%
    per un po'' riduce gli slot (aggiungerne altri diluirebbe solo la banda), sotto il 50% con torrent in coda con fonti reali non sfruttate li
    aumenta. Max upload attivi scende a 1 quando c''è un download vicino al completamento in corso (il seeding può aspettare) e torna al valore
    configurato quando finisce. Max totali si adatta di conseguenza per non diventare lui stesso il collo di bottiglia. Assegna anche più connessioni,
    slot upload e banda ai singoli torrent più vicini al completamento o con più fonti (peer/seed) rispetto a quelli lenti o senza fonti. Se disattivata,
    tutto torna ai tre valori statici configurati sopra.'
  : 'Cuando está activo, el sistema se ajusta solo a las descargas máximas activas, a las cargas máximas activas y a los totales máximos (arriba,
    que solo se convierten en el punto de partida en cada reinicio del ciclo de ~2 h; los campos están deshabilitados). Las descargas máximas
    activas se mueven entre Mínimo y Máximo a continuación, según la cantidad de ancho de banda que HA establecido (límite de descarga) se está
    utilizando realmente; no es un ancho de banda "real" medido, sino su límite configurado: por encima del 90 % durante un tiempo reduce las
    ranuras (agregar más solo diluiría el ancho de banda), por debajo del 50 % con torrents en cola con fuentes reales sin explotar las aumentan.
    Las cargas activas máximas disminuyen a 1 cuando hay una descarga casi completa en progreso (la inicialización puede esperar) y vuelve al
    valor configurado cuando finaliza. Max Totals se adapta en consecuencia para no convertirse él mismo en el cuello de botella. También asigna
    más conexiones, espacios de carga y ancho de banda a los torrents individuales que están más cerca de completarse o con más fuentes (peer/seed)
    que a aquellos que son lentos o no tienen fuentes. Si se desactiva, todo vuelve a los tres valores estáticos configurados anteriormente.'
