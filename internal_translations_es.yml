  "Scegli il motore dalla tendina «Motore torrent». Il binario gestito è scaricato e aggiornato da Gextto.": "Elige el motor en la lista «Motor torrent». El binario gestionado lo descarga y actualiza Gextto."
  "Se Sì, un film arrivato dentro una cartella torrent viene spostato nella cartella film come file singolo, portando con sé sottotitoli e artwork. Se No, resta nella sua cartella.": "Si Sí, una película que llega dentro de una carpeta torrent se mueve a la carpeta de películas como archivo suelto, con subtítulos e imágenes. Si No, se queda en su carpeta."
  "Se una release raggiunge almeno questo punteggio, ignora il delay configurato.": "Si una release alcanza al menos esta puntuación, se ignora el retraso configurado."
  "Segreto condiviso con gx-torrent (header X-Gx-Token). Facoltativo se gx-torrent ascolta solo su 127.0.0.1; obbligatorio se lo esponi in rete. Non visualizzato.": "Secreto compartido con gx-torrent (cabecera X-Gx-Token). Opcional si gx-torrent solo escucha en 127.0.0.1; obligatorio si lo expones en la red. No se muestra."
