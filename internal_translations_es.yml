  "Gextto cerca le release negli indexer di Prowlarr o Jackett e usa TMDB per titoli, locandine e calendario. Puoi aggiungerne altri dopo, in Impostazioni.": "Gextto busca las releases en los indexadores de Prowlarr o Jackett y usa TMDB para títulos, carteles y calendario. Puedes añadir más después, en Ajustes."
