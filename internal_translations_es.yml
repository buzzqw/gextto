  "Gextto cerca le release negli indexer di Prowlarr o Jackett e prende titoli, stagioni, episodi, locandine e calendario da TMDB (consigliato) oppure da TVDB. Basta una delle due chiavi: se ci sono entrambe vince TMDB. Puoi aggiungere altro dopo, in Impostazioni.": "Gextto busca las releases en los indexers de Prowlarr o Jackett y obtiene títulos, temporadas, episodios, pósteres y calendario de TMDB (recomendado) o de TVDB. Basta una de las dos claves: si están ambas, gana TMDB. Puedes añadir más después, en Ajustes."
  "TMDB (consigliato)": "TMDB (recomendado)"
  "Gratuita su themoviedb.org → Impostazioni → API. È la fonte consigliata.": "Gratuita en themoviedb.org → Ajustes → API. Es la fuente recomendada."
  "TVDB (alternativa)": "TVDB (alternativa)"
