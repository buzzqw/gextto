  "Intervallo minimo in millisecondi tra due letture dello stato dei torrent (250–60000, predefinito 1500). La coda è gestita da gx-torrent stesso, non dipende da questo valore.": "Intervalo mínimo en milisegundos entre dos lecturas del estado (250–60000, predeterminado 1500). La cola la gestiona gx-torrent y no depende de este valor."
