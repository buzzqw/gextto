  # Pack inspection while downloading
  "Ispeziona i pack in download e scarta quelli inutili": "Inspeccionar los packs durante la descarga y descartar los inútiles"
  "Attivo: quando un pack è in download, appena il motore conosce la lista dei file gextto controlla se almeno un episodio serve davvero (manca dalla libreria oppure è un vero upgrade). Se nessuno serve, il torrent viene rimosso con i dati parziali e messo in blocklist, così non viene più scaricato. Vale soprattutto per i magnet, dove la lista file non è nota prima di iniziare. Spento: il pack viene scaricato per intero e deciso solo a download finito.": "Activado: mientras se descarga un pack, en cuanto el motor conoce la lista de archivos Gextto comprueba si al menos un episodio es realmente necesario (falta de la biblioteca o es una mejora real). Si ninguno lo es, el torrent se elimina con sus datos parciales y se añade a la lista de bloqueo, para que no se vuelva a descargar. Esto vale sobre todo para los magnets, donde la lista de archivos no se conoce antes de empezar. Desactivado: el pack se descarga entero y se decide solo al terminar la descarga."
  "Nei pack utili scarica solo i file che servono": "En los packs útiles descargar solo los archivos necesarios"
  "Attivo (con l'ispezione dei pack): quando il pack contiene solo alcuni episodi che servono, il motore scarica soltanto quei file e salta gli altri (priorità 0). Sottotitoli e file senza numero di episodio restano attivi. Spento: il pack utile viene scaricato per intero.": "Activado (con la inspección de packs): cuando el pack contiene solo algunos de los episodios necesarios, el motor descarga solo esos archivos y omite los demás (prioridad 0). Los subtítulos y los archivos sin número de episodio permanecen activos. Desactivado: el pack útil se descarga entero."

