  "Gextto è attivo: il servizio sta lavorando (scarica, importa, cerca). Non è lo stato di salute: quello è il badge «ok» in alto.": "Gextto está activo: el servicio trabaja (descarga, importa, busca). No es el estado de salud: ese es el badge «ok» de arriba."
