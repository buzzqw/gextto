  "Controlla che la porta peer sia in ascolto e che il router la inoltri.": "Comprueba que el puerto peer escucha y que el router lo redirige."
  "Porta peer usata dal motore torrent. «Test porte» verifica che sia in ascolto e inoltrata dal router (disponibile con gx-torrent).": "Puerto peer usado por el motor torrent. «Probar puertos» comprueba que escucha y que el router lo redirige (disponible con gx-torrent)."
  "Controlla gli aggiornamenti": "Buscar actualizaciones"
  "Aggiornamenti": "Actualizaciones"
  "Scarica periodicamente da GitHub le informazioni sull'ultima build (ogni quante ore lo decide «Intervallo controllo aggiornamenti») e, se ce n'è una nuova, mostra «Aggiornamento disponibile». Non invia dati e non aggiorna da solo: l'aggiornamento parte solo da Manutenzione.": "Descarga periódicamente de GitHub la información de la última compilación (la frecuencia la fija «Intervalo de comprobación de actualizaciones») y, si hay una más nueva, muestra «Actualización disponible». No envía datos ni actualiza solo: la actualización solo empieza desde Mantenimiento."
  "Intervallo controllo aggiornamenti": "Intervalo de comprobación de actualizaciones"
  "Ogni quante ore Gextto controlla se è uscita una nuova build (da 1 a 720). Il controllo scarica solo un piccolo file da GitHub; «Verifica aggiornamenti» in Manutenzione controlla subito.": "Cada cuántas horas comprueba Gextto si hay una nueva compilación (de 1 a 720). La comprobación solo descarga un archivo pequeño de GitHub; «Buscar actualizaciones» en Mantenimiento comprueba al momento."
  "Nuova versione disponibile: apri Manutenzione": "Nueva versión disponible: abre Mantenimiento"
  "Installazione da sorgenti: aggiorna con git pull e make build.": "Instalación desde el código fuente: actualiza con git pull y make build."
  "Aggiornamento in corso: Gextto attende la fine delle copie verso la libreria, poi si riavvia. Questo pannello si aggiorna da solo.": "Actualización en curso: Gextto espera a que terminen las copias a la biblioteca y luego se reinicia. Este panel se actualiza solo."
  "Nuova versione": "Nueva versión"
  "Novità rispetto alla versione installata:": "Novedades respecto a la versión instalada:"
  "Elenco parziale: la versione installata è più vecchia delle modifiche mostrate.": "Lista parcial: la versión instalada es más antigua que los cambios mostrados."
  "Prima di aggiornare viene creato un backup dei database. Se la nuova versione non parte, torna automaticamente quella precedente.": "Antes de actualizar se crea una copia de seguridad de las bases de datos. Si la nueva versión no arranca, vuelve automáticamente la anterior."
  "Aggiornamento dalla UI non configurato: riesegui l'installer (install.sh) per abilitarlo, oppure usa sudo gexttod --update.": "La actualización desde la interfaz no está configurada: vuelve a ejecutar el instalador (install.sh) o usa sudo gexttod --update."
