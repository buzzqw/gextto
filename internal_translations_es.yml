  "Gextto scarica da sé l'ultima release di qBittorrent-nox, la installa nella cartella dell'applicazione (accanto a gexttod), la avvia e la ferma con il servizio e la aggiorna (con backup e rollback). Il motore in uso però si sceglie dalla voce «Motore torrent»: questa opzione non lo cambia.": "Gextto descarga por sí mismo la última versión de qBittorrent-nox, la instala en la carpeta de la aplicación (junto a gexttod), la inicia y detiene con el servicio y la actualiza (con copia y vuelta atrás). El motor en uso se elige en «Motor torrent»: esta opción no lo cambia."
  "Giapponese": "Japonés"
  "Giorni di conservazione per le pulizie non forzate; 0 elimina tutto il contenuto del cestino. Le azioni manuali della UI svuotano sempre subito il cestino.": "Días de conservación para las limpiezas no forzadas; 0 borra todo el contenido de la papelera. Las acciones manuales de la interfaz siempre la vacían enseguida."
  "Gruppi custom": "Grupos personalizados"
  "I filtri selezionati sopra impediscono di archiviare nuove release corrispondenti. Non cancellano retroattivamente le voci esistenti: qui puoi trovarle e rimuoverle singolarmente, selezionate o tutte insieme. La ricerca usa gli stessi filtri attivi; modificali e salvali sopra per cambiare i contenuti da trovare.": "Los filtros seleccionados arriba impiden archivar nuevas releases que coincidan. No borran retroactivamente las entradas existentes: aquí puedes encontrarlas y quitarlas una a una, las seleccionadas o todas juntas. La búsqueda usa los mismos filtros activos; cámbialos y guárdalos arriba para cambiar lo que se encuentra."
  "I torrent che non trasferiscono dati non consumano uno slot attivo.": "Los torrents que no transfieren datos no ocupan una ranura activa."
  "Ignora le release più vecchie di N giorni (0 = nessun limite). Le release senza data sono considerate pubblicate oggi.": "Ignora las releases con más de N días (0 = sin límite). Las releases sin fecha cuentan como publicadas hoy."
  "Il nome deve corrispondere al tag finale della release (es. TBK). Il punteggio viene sommato allo score tecnico; sono ammessi anche valori negativi.": "El nombre debe coincidir con la etiqueta final de la release (p. ej. TBK). La puntuación se suma a la técnica; se admiten valores negativos."
  "Indica dove il motore torrent accetta connessioni: 0.0.0.0:6881-6891 per tutte le interfacce, 127.0.0.1:6881 solo in locale, oppure wg0:6881/tun0:6881 per una VPN. Il valore proposto va bene nella maggior parte dei casi.": "Dónde acepta el motor torrent conexiones: 0.0.0.0:6881-6891 para todas las interfaces, 127.0.0.1:6881 solo en local, o wg0:6881/tun0:6881 para una VPN. El valor propuesto vale en la mayoría de los casos."
  "Indirizzo di ascolto del demone. Predefinito 127.0.0.1:8890, cioè solo questo server: pagina web e API non escono in LAN. Per esporle in LAN usa 0.0.0.0:8890 e imposta gxtorrent_token (senza token Gextto avvia il demone in -insecure e lo segnala nel log). Il traffico peer usa sempre la porta singola/le torrent_port_*.": "Dirección de escucha del demonio. Por defecto 127.0.0.1:8890, es decir solo este servidor: la página web y la API no salen a la LAN. Para exponerlas en la LAN usa 0.0.0.0:8890 y define gxtorrent_token (sin token, Gextto inicia el demonio en -insecure y lo registra). El tráfico de pares usa siempre el puerto único/torrent_port_*."
