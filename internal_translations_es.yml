  "Dove cerca la ricerca manuale: Kad (rete distribuita, non serve un server), Kad + server eD2k (entrambe le ricerche, risultati uniti), tutti i server eD2k (globale) o solo il server a cui aMule è connesso. Il fallback automatico cerca sempre su Kad e sui server.": "Dónde busca la búsqueda manual: Kad (red distribuida, no hace falta un servidor), Kad + servidores eD2k (ambas búsquedas, resultados unidos), todos los servidores eD2k (global) o solo el servidor al que está conectado aMule. El respaldo automático busca siempre en Kad y en los servidores."
