  "L'interfaccia ascolta su tutta la rete. Una password impedisce a chiunque altro di cambiare la configurazione o avviare download. Dalla rete locale puoi lasciare l'accesso libero.": "La interfaz escucha en toda la red. Una contraseña impide que otros cambien la configuración o inicien descargas. Desde la red local puedes dejar el acceso libre."
