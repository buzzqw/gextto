  "Con la velocità su Auto misura la latenza verso Internet; se il download o l'upload la fanno salire mentre altri dispositivi di casa usano la linea, li rallenta quanto basta e poi li libera di nuovo. Se nessun altro la usa, la banda resta tutta a Gextto.": "Con la velocidad en Auto mide la latencia hacia Internet; si la descarga o la subida la hacen subir mientras otros dispositivos de casa usan la línea, las frena lo justo y luego las libera de nuevo. Si nadie más la usa, toda la línea queda para Gextto."
