  "Killswitch VPN: interfaccia usata per tutto il traffico BitTorrent in uscita.": "Interruptor VPN: interfaz usada para todo el tráfico BitTorrent saliente."
  "L'URL o il file si impostano nei campi «IP filter» qui nella scheda; con un URL Gextto lo scarica e lo applica. Funziona anche con gx-torrent.": "La URL o el archivo se configuran en los campos «IP filter» de esta sección; con una URL Gextto la descarga y la aplica. También funciona con gx-torrent."
  "Le release che contengono queste parole o script (es. [non-latino], [porno]) vengono escluse. Le modifiche si salvano subito.": "Se excluyen las releases que contienen estas palabras o escrituras (p. ej. [non-latino], [porno]). Los cambios se guardan enseguida."
  "Limite di seeding in minuti, usato solo se Seed massimo (giorni) è 0.": "Límite de compartición en minutos, solo si Compartición máxima (días) es 0."
  "Lingua usata per i metadati TMDB (es. it-IT, en-US).": "Idioma usado para los metadatos de TMDB (p. ej. it-IT, en-US)."
  "Serve solo se qBittorrent vede le cartelle con percorsi diversi (Docker, NAS, altro host): una riga per percorso, forma locale=remoto. Stessa macchina e stesse cartelle — o modalità gestita —: lascia pure vuoto.": "Solo necesario cuando qBittorrent ve las carpetas con rutas distintas (Docker, NAS, otro equipo): una línea por ruta, forma local=remoto. Misma máquina con las mismas carpetas — o modo gestionado —: déjalo vacío."
