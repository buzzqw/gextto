  "Kad cerca nella rete distribuita; Kad + server fa entrambe le ricerche e unisce i risultati; Globale interroga tutti i server eD2k; Server solo quello a cui sei connesso": "Kad busca en la red distribuida; Kad + servidores hace ambas búsquedas y une los resultados; Global consulta todos los servidores eD2k; Servidor solo aquel al que estás conectado"
