  "Applica periodicamente l'ottimizzazione di cache, buffer e coda in base alle risorse.": "Aplica periódicamente la optimización de caché, búferes y cola según los recursos."
  "Applica una base sicura e suggerisce cache e buffer in base alla RAM.": "Aplica una base segura y sugiere caché y búferes según la RAM."
  "Associa un tag del torrent a una cartella temporanea e finale.": "Asocia una etiqueta del torrent a una carpeta temporal y final."
  "Attiva l'autogestione di gx-torrent: coda dinamica e cache adattiva (dimensionata su memoria disponibile, download/seed attivi e tipo di storage). Predefinito attivo. Disattivalo per fissare a mano cache e slot.": "Activa la autogestión de gx-torrent: cola dinámica y caché adaptativa (dimensionada según memoria disponible, descargas/compartidos activos y tipo de almacenamiento). Activado por defecto. Desactívalo para fijar a mano caché y ranuras."
  "Attiva la pulizia periodica dei dati tecnici e dello storico.": "Activa la limpieza periódica de los datos técnicos y del historial."
  "Attiva log dettagliati e diagnostiche periodiche per il debug.": "Activa registros detallados y diagnósticos periódicos para depurar."
  "Attiva o disattiva il daemon Gextto: cicli automatici e download.": "Activa o desactiva el servicio Gextto: ciclos automáticos y descargas."
  "Attivo: a fine seed il torrent completato viene tolto dalla sessione (come «Pulisci completati»). Spento: a fine seed il torrent resta nell'elenco come Completato e lo rimuovi tu con «Pulisci completati». Non influisce su dove vengono spostati i file.": "Activado: al acabar de compartir, el torrent completado se quita de la sesión (como «Limpiar completados»). Desactivado: queda en la lista como Completado y lo quitas tú con «Limpiar completados». No influye en dónde se mueven los archivos."
  "Attivo: la sorgente scaricata viene spostata in libreria e rimossa dalla cartella download (per i torrent al termine del seed; per eD2k al completamento, perché il seeding è gestito da aMule). Spento: la sorgente viene copiata o collegata e mantenuta per la condivisione.": "Activado: la fuente descargada se mueve a la biblioteca y se elimina de la carpeta de descarga (en los torrents al terminar de compartir; en eD2k al completarse, porque la compartición la gestiona aMule). Desactivado: la fuente se copia o se enlaza y se conserva para compartir."
