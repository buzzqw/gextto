  "Abilita il media server DLNA/UPnP di gx-torrent: i media completati dei torrent sono visibili a TV e console sulla rete locale. Solo LAN, senza autenticazione; disattivato di default. Funziona solo con il motore gx-torrent.": "Activa el servidor multimedia DLNA/UPnP de gx-torrent: los medios terminados de los torrents son visibles para TVs y consolas de la red local. Solo red local, sin autenticación; desactivado por defecto. Funciona solo con el motor gx-torrent."
  "Indirizzo e porta di ascolto del media server DLNA (es. :8200 per tutte le interfacce, 192.168.1.10:8200 per una sola). Vuoto = :8200. La discovery usa UDP 1900 sulla stessa interfaccia.": "Dirección y puerto de escucha del servidor multimedia DLNA (p. ej. :8200 para todas las interfaces, 192.168.1.10:8200 para una). Vacío = :8200. El descubrimiento usa UDP 1900 en la misma interfaz."
  "Nome mostrato ai lettori DLNA sulla rete. Vuoto = gx-torrent.": "Nombre mostrado a los reproductores DLNA de la red. Vacío = gx-torrent."
  "gx-torrent — DLNA: cartelle della libreria": "gx-torrent — DLNA: carpetas de la biblioteca"
  "Cartelle della libreria (es. l'archivio sul NAS) mostrate dal media server DLNA accanto ai torrent, navigabili per cartelle; separale con ;. Vuoto = automatico: la cartella archivio e le cartelle che contengono gli archivi delle serie. Sola lettura; il cestino, le cartelle nascoste e quelle di sistema del NAS sono escluse.": "Carpetas de la biblioteca (p. ej. el archivo en el NAS) que el servidor multimedia DLNA muestra junto a los torrents, navegables por carpetas; sepáralas con ;. Vacío = automático: la carpeta de archivo y las carpetas que contienen los archivos de las series. Solo lectura; se excluyen la papelera, las carpetas ocultas y las de sistema del NAS."
