  "Collega Gextto ad aMule (amuled) per cercare su eD2k e Kad, incollare link ed2k:// e vedere i download in Scarico. aMule va installato e avviato a parte, con le connessioni esterne (EC) attive. Spento per default.": "Conecta Gextto con aMule (amuled) para buscar en eD2k y Kad, pegar enlaces ed2k:// y ver las descargas en Descargas. aMule se instala y se inicia aparte, con las conexiones externas (EC) activadas. Desactivado por defecto."
