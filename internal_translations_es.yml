  "Senza una API key TMDB o TVDB la ricerca dei titoli non è disponibile: aggiungila al passo precedente, oppure aggiungi i titoli dopo da Serie TV e Film.": "Sin una clave API de TMDB o TVDB la búsqueda de títulos no está disponible: añádela en el paso anterior, o añade los títulos después desde Series y Películas."
  "TVDB API key (TMDB è consigliata; senza TMDB manca la sezione Scopri)": "Clave API de TVDB (se recomienda TMDB; sin TMDB falta la sección Descubrir)"
  "TMDB o TVDB API key": "Clave API de TMDB o TVDB"
  "TMDB API key (consigliata)": "Clave API de TMDB (recomendada)"
  "TVDB API key (alternativa a TMDB)": "Clave API de TVDB (alternativa a TMDB)"
  "TVDB PIN abbonato": "PIN de suscriptor de TVDB"
  "Chiave API v4 di TheTVDB. Senza la chiave TMDB, TVDB fornisce tutti i metadati: ricerca dei titoli, stagioni ed episodi, mancanti, numerazione anime, stato, calendario, titoli degli episodi e locandine (non la sezione Scopri).": "Clave API v4 de TheTVDB. Sin la clave TMDB, TVDB proporciona todos los metadatos: búsqueda de títulos, temporadas y episodios, episodios que faltan, numeración de anime, estado, calendario, títulos de episodios y pósteres (no la sección Descubrir)."
  "PIN dell'abbonamento TheTVDB: serve solo con le chiavi di tipo «user-supported», che lo richiedono al login.": "PIN de la suscripción a TheTVDB: solo lo necesitan las claves «user-supported», que lo piden al iniciar sesión."
  "Chiave API TMDB (consigliata, gratuita): fonte principale di titoli, poster e metadati. Se c'è, ha la precedenza su TVDB.": "Clave API de TMDB (recomendada, gratuita): fuente principal de títulos, pósteres y metadatos. Si está configurada, tiene prioridad sobre TVDB."
  "Prima/ultima parte dei file": "Primera/última parte de los archivos"
