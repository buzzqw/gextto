  "I .torrent trovati in queste cartelle vengono scaricati: il file viene letto e il suo contenuto aggiunto automaticamente alla sessione.": "Los archivos .torrent encontrados en estas carpetas se descargan: cada archivo se lee y su contenido se añade automáticamente a la sesión."
