  "Ritocca nel tempo i valori scelti dal sistema (per esempio lo spazio libero minimo) quando cambiano le condizioni. Non tocca mai i valori impostati a mano; spegnilo per avere valori fissi.": "Ajusta con el tiempo los valores elegidos por el sistema (por ejemplo, el espacio libre mínimo) cuando cambian las condiciones. Nunca toca los valores que defines a mano; desactívalo para mantener valores fijos."
  "Ciclo automatico (ricerca e download)": "Ciclo automático (búsqueda y descarga)"
  "Interruttore generale del ciclo: quando è spento Gextto non cerca e non scarica da solo. Acceso di default; con la prova (dry-run) attiva cerca senza scaricare.": "El interruptor general del ciclo: si está apagado, Gextto no busca ni descarga por sí solo. Activado por defecto; en prueba (dry-run) busca sin descargar."
  "Non attivo": "No activo"
  "Cosa Gextto cerca online durante il ciclo. «Automatica»: la ricerca dei titoli sugli indexer parte solo quando non c'è nessun feed RSS configurato. «Sempre»: parte comunque, anche con i feed. «Mai»: usa solo i feed e l'archivio locale, nessuna ricerca online.": "Qué busca Gextto en línea durante el ciclo. «Automática»: la búsqueda de títulos en los indexadores solo se lanza cuando no hay ningún feed RSS configurado. «Siempre»: se lanza igualmente, incluso con feeds. «Nunca»: solo feeds y archivo local, ninguna búsqueda en línea."
  "Il «Ritardo prima di scaricare» tiene una release in attesa per vedere se ne arriva una migliore. Se lo score della release raggiunge almeno questo valore, il ritardo si salta e la release parte subito. 0 = il ritardo non si salta mai: nessun punteggio lo bypassa.": "El «Retraso antes de descargar» mantiene una release en espera para ver si llega una mejor. Si la puntuación de la release alcanza al menos este valor, el retraso se salta y la release empieza enseguida. 0 = el retraso nunca se salta: ninguna puntuación lo evita."
  "Intervallo tra le ricerche automatiche di serie e film, in ore.": "Intervalo entre las búsquedas automáticas, en horas."
