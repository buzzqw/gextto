  "Prossimi episodi e uscite dei film da aggiungere a Thunderbird, Google Calendar o al telefono: copia l'indirizzo del link e iscriviti al calendario. Con l'accesso protetto aggiungi ?apikey=<chiave> all'indirizzo.": "Próximos episodios y estrenos de películas para Thunderbird, Google Calendar o el teléfono: copia la dirección del enlace y suscríbete al calendario. Con el acceso protegido, añade ?apikey=<clave> a la dirección."
