  "Niente upgrade": "Sin mejoras"
  "Le release degli anime numerano gli episodi dall'inizio senza stagioni («Titolo - 1071»): Gextto converte il numero in stagione ed episodio con i dati TMDB e cerca anche il numero assoluto.": "Las publicaciones de anime numeran los episodios desde el principio sin temporadas («Título - 1071»): Gextto convierte el número en temporada y episodio con los datos de TMDB y también busca el número absoluto."
  "Una release migliore non sostituisce più un file già archiviato di questa serie.": "Una publicación mejor ya no sustituye un archivo ya archivado de esta serie."
  "Download in corso": "Descargas en curso"
  "Attivo: un file che resta in seed entra in libreria come hardlink, cioè un secondo nome per gli stessi dati, senza occupare spazio due volte. Cancellare uno dei due nomi non tocca l'altro. Funziona solo se download e libreria sono sullo stesso filesystem; altrimenti gextto copia come prima.": "Activado: un archivo que sigue compartiéndose entra en la biblioteca como enlace duro, un segundo nombre para los mismos datos, sin ocupar el espacio dos veces. Borrar uno de los dos nombres no afecta al otro. Solo funciona si las descargas y la biblioteca están en el mismo sistema de archivos; si no, gextto copia como antes."
  "Solo se Jellyfin vede la libreria con percorsi diversi (es. Docker): una riga per cartella, percorso_gextto=percorso_jellyfin. Serve per chiedere a Jellyfin di aggiornare solo la cartella appena cambiata.": "Solo si Jellyfin ve la biblioteca con rutas distintas (p. ej. Docker): una línea por carpeta, ruta_gextto=ruta_jellyfin. Sirve para pedir a Jellyfin que actualice solo la carpeta que acaba de cambiar."
  "Solo se Plex vede la libreria con percorsi diversi (es. Docker): una riga per cartella, percorso_gextto=percorso_plex. Serve per chiedere a Plex di aggiornare solo la cartella appena cambiata.": "Solo si Plex ve la biblioteca con rutas distintas (p. ej. Docker): una línea por carpeta, ruta_gextto=ruta_plex. Sirve para pedir a Plex que actualice solo la carpeta que acaba de cambiar."
  "Quando il file in libreria ha almeno questo punteggio non si cercano più miglioramenti; resta accettato solo un REPACK o PROPER che corregge una release difettosa. Riferimenti: 1080p WEB-DL H.264 ≈ 1280, 1080p WEB-DL H.265 DD+ ≈ 1480, 2160p ≈ 2480. 0 = migliora sempre. Per fermare del tutto gli upgrade di un solo titolo usa «Niente upgrade» nella sua scheda.": "Cuando el archivo de la biblioteca alcanza al menos esta puntuación, ya no se buscan mejoras; solo se acepta un REPACK o PROPER que corrige una publicación defectuosa. Referencias: 1080p WEB-DL H.264 ≈ 1280, 1080p WEB-DL H.265 DD+ ≈ 1480, 2160p ≈ 2480. 0 = mejorar siempre. Para detener las mejoras de un solo título usa «Sin mejoras» en su ficha."
  "Spento (predefinito): chiunque raggiunga gextto lo usa, come in una LAN fidata. Acceso: chi non è in rete locale deve fare il login o usare la chiave API. Resta aperto finché non imposti una password o una chiave. Se resti chiuso fuori, avvia gextto con GEXTTO_AUTH_DISABLE=1.": "Desactivado (predeterminado): cualquiera que llegue a gextto puede usarlo, como en una LAN de confianza. Activado: fuera de la red local hay que iniciar sesión o usar la clave API. Permanece abierto hasta que configures una contraseña o una clave. Si te quedas fuera, inicia gextto con GEXTTO_AUTH_DISABLE=1."
  "Acceso (predefinito): dalla rete di casa (127.0.0.1, 192.168.x.x, 10.x.x.x, 172.16-31.x.x) non serve il login. Dietro un reverse proxy conta l'indirizzo reale del client inoltrato dal proxy.": "Activado (predeterminado): desde la red de casa (127.0.0.1, 192.168.x.x, 10.x.x.x, 172.16-31.x.x) no hace falta iniciar sesión. Detrás de un proxy inverso cuenta la dirección real del cliente reenviada por el proxy."
  "Nome utente per il login (predefinito admin).": "Nombre de usuario para iniciar sesión (admin por defecto)."
  "Password per il login. Viene salvata solo come hash; lascia vuoto per non cambiarla.": "Contraseña para iniciar sesión. Se guarda solo como hash; déjala vacía para no cambiarla."
  "Chiave per script, TUI (variabile GEXTTO_API_KEY) e calendario iCal: header X-Api-Key oppure ?apikey= nell'indirizzo. Scegli una stringa lunga e casuale.": "Clave para scripts, la TUI (variable GEXTTO_API_KEY) y el calendario iCal: cabecera X-Api-Key o ?apikey= en la dirección. Elige una cadena larga y aleatoria."
  "Accedi per continuare.": "Inicia sesión para continuar."
