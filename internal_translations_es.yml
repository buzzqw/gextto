  "solo se la chiave lo richiede": "solo si la clave lo requiere"
  "Usata al posto di TMDB quando manca la chiave TMDB. Chiave v4 da thetvdb.com → Dashboard → API keys. Le chiavi «user-supported» richiedono un abbonamento TVDB e il suo PIN. Con TVDB manca solo la sezione Scopri.": "Se usa en lugar de TMDB cuando falta la clave TMDB. Clave v4 de thetvdb.com → Dashboard → API keys. Las claves «user-supported» requieren una suscripción a TVDB y su PIN. Con TVDB solo falta la sección Descubrir."
  "Cerca un titolo su TVDB e aggiungilo: Gextto lo cercherà e lo scaricherà al prossimo ciclo.": "Busca un título en TVDB y añádelo: Gextto lo buscará y lo descargará en el próximo ciclo."
