  "Se un download è fermo da almeno questi minuti — a 0 B/s oppure ancora in attesa del suo elenco di file (metadati, tipico dei magnet morti) — la ricerca può avviare una versione alternativa della stessa puntata o film. Il download fermo resta in sessione e può riprendersi; la deduplica dell'archivio terrà poi la copia migliore. 0 disattiva.": "Si una descarga lleva bloqueada al menos estos minutos — a 0 B/s o aún esperando su lista de archivos (metadatos, típico de los magnet muertos) — la búsqueda puede iniciar una versión alternativa del mismo episodio o película. La descarga bloqueada permanece en la sesión y puede recuperarse; la deduplicación del archivo conservará después la mejor copia. 0 lo desactiva."
  "Quanti punti di punteggio in meno sono accettati per l'alternativa rispetto alla release bloccata. Il download bloccato non viene rimosso: parte solo un'alternativa adeguata (non una versione scadente). 0 disattiva.": "Cuántos puntos por debajo de la release bloqueada puede puntuar la alternativa. La descarga bloqueada no se elimina: solo se inicia una alternativa adecuada (nunca una versión mala). 0 lo desactiva."
