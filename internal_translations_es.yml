  "Rimuove il torrent dalla sessione e chiede se eliminare anche i file.": "Elimina el torrent de la sesión y pregunta si también hay que borrar los archivos."
  "Salva il tag del torrent; un campo vuoto lo rimuove.": "Guarda la etiqueta del torrent; un campo vacío la elimina."
  "Seed e peer riportati dallo scrape del tracker; — se il tracker non li fornisce.": "Semillas y pares informados por el scrape del tracker; — si el tracker no los proporciona."
  "Sposta i dati del torrent nel nuovo percorso; l'operazione può richiedere tempo.": "Mueve los datos del torrent a la nueva ruta; la operación puede tardar."
  "Ultimo esito dell'annuncio: verificato, non verificato o il messaggio di errore.": "Último resultado del anuncio: verificado, no verificado o el mensaje de error."
  "Uno o più URL HTTP da cui scaricare i pezzi oltre ai peer, separati da spazi.": "Una o varias URL HTTP para descargar piezas además de los pares, separadas por espacios."
  "Velocità di download da questo peer.": "Velocidad de descarga desde este par."
  "Velocità di upload verso questo peer.": "Velocidad de subida hacia este par."
  "Attiva o disattiva la rinomina dei file di questo torrent quando vengono archiviati in libreria.": "Activa o desactiva el renombrado de los archivos de este torrent al archivarlos en la biblioteca."
  "Invia subito un annuncio ai tracker per cercare nuovi peer.": "Envía un anuncio a los trackers de inmediato para buscar nuevos pares."
  "Ferma e riavvia il torrent nella sessione senza perdere i dati già scaricati.": "Detiene y reinicia el torrent en la sesión sin perder los datos ya descargados."
  "Modalità super seeding: distribuisce i pezzi in modo che i peer si scambino tra loro. Non aumenta il rapporto.": "Modo super seeding: distribuye las piezas para que los pares se las intercambien. No aumenta la relación."
  "Rimette il torrent nella gestione automatica della coda.": "Vuelve a poner el torrent bajo la gestión automática de la cola."
  "Tiene il torrent fuori dalla rotazione automatica della coda e lo lascia attivo.": "Mantiene el torrent fuera de la rotación automática de la cola y lo deja activo."
  "Blocklista la release e rimuove il torrent dalla sessione; i file restano e puoi scegliere se eliminarli.": "Pone la release en la lista de bloqueo y elimina el torrent de la sesión; los archivos permanecen y puedes elegir si borrarlos."

  "Queste cartelle appartengono ad aMule: Gextto le legge soltanto. Si cambiano da aMule/amuled; dopo la modifica riavvia Gextto (oppure riapri questa pagina) perché usi il nuovo percorso.": "Estas carpetas pertenecen a aMule: Gextto solo las lee. Cámbialas en aMule/amuled; tras el cambio reinicia Gextto (o vuelve a abrir esta página) para que use la nueva ruta."
  "Queste cartelle appartengono ad aMule: Gextto le legge soltanto. Si cambiano da aMule/amuled.": "Estas carpetas pertenecen a aMule: Gextto solo las lee. Cámbialas en aMule/amuled."
  "Cartella in cui aMule salva i file completati. Si cambia da aMule/amuled; dopo la modifica riavvia Gextto.": "Carpeta en la que aMule guarda los archivos completados. Cámbiala en aMule/amuled; tras el cambio reinicia Gextto."
  "Cartella in cui aMule tiene i file incompleti. Si cambia da aMule/amuled; dopo la modifica riavvia Gextto.": "Carpeta en la que aMule mantiene los archivos incompletos. Cámbiala en aMule/amuled; tras el cambio reinicia Gextto."

  "Esegue periodicamente la pulizia dei dati tecnici: statistiche dei cicli, visti nei feed, storico download, schede errore, log delle ricerche gap e backup degli upgrade. Non tocca file, libreria, Archivio release o torrent attivi.": "Limpia periódicamente los datos técnicos: estadísticas de ciclos, filas vistas en los feeds, historial de descargas, fichas de error, registros de búsqueda de gaps y copias de seguridad de upgrades. No toca archivos, biblioteca, Archivo de releases ni torrents activos."
  "Ogni quante ore parte l'housekeeping. Dopo un riavvio il primo giro avviene dopo 10 minuti o alla scadenza dell'intervallo; un riavvio non lo fa ripartire.": "Cada cuántas horas se ejecuta el housekeeping. Tras un reinicio, la primera pasada ocurre 10 minutos después o al vencer el intervalo; un reinicio no lo vuelve a lanzar."
  "Quante statistiche dei cicli di ricerca conservare (release esaminate, candidate, download avviati, gap, errori). Con 200, il ciclo 201 elimina i contatori del ciclo più vecchio: non elimina release, file o download.": "Cuántas estadísticas de ciclos de búsqueda conservar (releases examinadas, candidatas, descargas iniciadas, gaps, errores). Con 200, el ciclo 201 elimina los contadores del ciclo más antiguo: no borra releases, archivos ni descargas."
  "Elimina le righe storiche dei «visti nei feed» più vecchie di N giorni. Riguarda solo il database dei feed, non l'Archivio release, i file o i download. 0 = nessuna pulizia.": "Elimina las filas vistas en los feeds más antiguas de N días. Solo afecta a la base de datos de los feeds, no al Archivo de releases, archivos o descargas. 0 = sin limpieza."
  "Elimina dallo Storico download le righe dei torrent già rimossi più vecchie di N giorni. Non tocca l'Archivio release, i file in libreria o i torrent attivi. 0 = conserva sempre.": "Elimina del historial de descargas las filas de torrents ya eliminados más antiguas de N días. No toca el Archivo de releases, los archivos de la biblioteca ni los torrents activos. 0 = conservar siempre."
  "Rimuove le schede dei torrent in errore più vecchie di N giorni (minimo 1). Evita di accumulare errori vecchi; non elimina file o torrent attivi.": "Elimina las fichas de error de torrents más antiguas de N días (mínimo 1). Evita acumular errores antiguos; no borra archivos ni torrents activos."
  "Elimina il log delle ricerche degli episodi mancanti più vecchio di N giorni. Non tocca gli episodi mancanti né la cronologia dei download. 0 = mai.": "Elimina el registro de búsqueda de episodios faltantes más antiguo de N días. No toca los episodios faltantes ni el historial de descargas. 0 = nunca."
  "Elimina i backup dei file sostituiti dagli upgrade più vecchi di N giorni. I backup servono a tornare indietro; 0 = mai.": "Elimina las copias de seguridad de archivos reemplazados por upgrades más antiguas de N días. Las copias sirven para volver atrás; 0 = nunca."
  "Abilita la pulizia automatica dell'archivio a ogni housekeeping: elimina solo le righe del catalogo release, mai file scaricati, libreria, storico download o torrent attivi.": "Activa la limpieza automática del archivo en cada housekeeping: elimina solo filas del catálogo de releases, nunca archivos descargados, la biblioteca, el historial de descargas o torrents activos."
  "Età massima delle release in archivio, in giorni (0 = nessun limite). La pulizia gira con l'housekeeping periodico.": "Edad máxima de las releases en el archivo, en días (0 = sin límite). La limpieza se ejecuta con el housekeeping periódico."
  "Numero minimo di release recenti da conservare sempre, anche se più vecchie dell'età massima.": "Número mínimo de releases recientes que conservar siempre, aunque superen la edad máxima."

