  "Prossimi episodi e uscite dei film da aggiungere a Thunderbird, Google Calendar o al telefono: copia l'indirizzo del link e iscriviti al calendario. Con l'accesso protetto aggiungi ?apikey=<chiave> all'indirizzo.": "Upcoming episodes and movie releases for Thunderbird, Google Calendar or your phone: copy the link address and subscribe to the calendar. With access control on, add ?apikey=<key> to the address."
