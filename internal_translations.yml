  ? "Quando attiva, il sistema regola da solo Max download attivi, Max upload attivi e Max totali (qui sopra, che diventano solo il punto di partenza a ogni riavvio del ciclo ~2h — i campi si disabilitano). Max download attivi si muove tra Minimo e Massimo qui sotto, in base a quanta della banda che HAI impostato (Limite download) viene davvero usata — non una banda 'reale' misurata, ma il tuo tetto configurato: sopra il 90% per un po' riduce gli slot (aggiungerne altri diluirebbe solo la banda), sotto il 50% con torrent in coda con fonti reali non sfruttate li aumenta. Max upload attivi scende a 1 quando c'è un download vicino al completamento in corso (il seeding può aspettare) e torna al valore configurato quando finisce. Max totali si adatta di conseguenza per non diventare lui stesso il collo di bottiglia. Assegna anche più connessioni, slot upload e banda ai singoli torrent più vicini al completamento o con più fonti (peer/seed) rispetto a quelli lenti o senza fonti. Se disattivata, tutto torna ai tre valori statici configurati sopra."
  : "When active, the system adjusts itself Max active downloads, Max active uploads and Max totals (above, which only become the starting point at each restart of the ~2h cycle — the fields are disabled). Max active downloads moves between Minimum and Maximum below, based on how much of the bandwidth you HAVE set (Download Limit) is actually being used — not a measured 'real' bandwidth, but your configured ceiling: above 90% for a while reduces the slots (adding more would only dilute the bandwidth), below 50% with torrents queued with real untapped sources increases them. Max active uploads drops to 1 when there is a near-complete download in progress (seeding can wait) and returns to the configured value when it finishes. Max totals adapts accordingly so as not to become the bottleneck himself. It also assigns more connections, upload slots and bandwidth to individual torrents that are closer to completion or with more sources (peer/seed) than to those that are slow or have no sources. If deactivated, everything reverts to the three static values ​​configured above."
