  "Gextto scarica da sé l'ultima release di qBittorrent-nox, la installa nella cartella dell'applicazione (accanto a gexttod), la avvia e la ferma con il servizio e la aggiorna (con backup e rollback). Il motore in uso però si sceglie dalla voce «Motore torrent»: questa opzione non lo cambia.": "Gextto downloads the latest qBittorrent-nox release itself, installs it in the application folder (next to gexttod), starts and stops it with the service and updates it (with backup and rollback). The engine in use is still chosen with «Torrent engine»: this option does not change it."
  "Giapponese": "Japanese"
  "Giorni di conservazione per le pulizie non forzate; 0 elimina tutto il contenuto del cestino. Le azioni manuali della UI svuotano sempre subito il cestino.": "Retention days for non-forced cleanups; 0 deletes the whole trash content. Manual actions in the UI always empty the trash right away."
  "Gruppi custom": "Custom groups"
  "I filtri selezionati sopra impediscono di archiviare nuove release corrispondenti. Non cancellano retroattivamente le voci esistenti: qui puoi trovarle e rimuoverle singolarmente, selezionate o tutte insieme. La ricerca usa gli stessi filtri attivi; modificali e salvali sopra per cambiare i contenuti da trovare.": "The filters selected above prevent new matching releases from being archived. They do not delete existing entries retroactively: here you can find them and remove them one by one, the selected ones or all together. The search uses the same active filters; change and save them above to change what is found."
  "I torrent che non trasferiscono dati non consumano uno slot attivo.": "Torrents that transfer no data do not use an active slot."
  "Ignora le release più vecchie di N giorni (0 = nessun limite). Le release senza data sono considerate pubblicate oggi.": "Ignores releases older than N days (0 = no limit). Releases without a date count as published today."
  "Il nome deve corrispondere al tag finale della release (es. TBK). Il punteggio viene sommato allo score tecnico; sono ammessi anche valori negativi.": "The name must match the final tag of the release (e.g. TBK). The score is added to the technical score; negative values are allowed."
  "Impostazioni libtorrent avanzate, una per riga nel formato chiave=valore.": "Advanced libtorrent settings, one per line as key=value."
  "Indica dove libtorrent accetta connessioni: 0.0.0.0:6881-6891 per tutte le interfacce, 127.0.0.1:6881 solo in locale, oppure wg0:6881/tun0:6881 per una VPN. Il valore proposto va bene nella maggior parte dei casi.": "Where libtorrent accepts connections: 0.0.0.0:6881-6891 for all interfaces, 127.0.0.1:6881 local only, or wg0:6881/tun0:6881 for a VPN. The proposed value fits most cases."
  "Indirizzo di ascolto del demone. Predefinito 127.0.0.1:8890, cioè solo questo server: pagina web e API non escono in LAN. Per esporle in LAN usa 0.0.0.0:8890 e imposta gxtorrent_token (senza token Gextto avvia il demone in -insecure e lo segnala nel log). Il traffico peer usa sempre la porta singola/le libtorrent_port_*.": "Daemon listen address. Default 127.0.0.1:8890, i.e. this server only: the web page and API stay off the LAN. To expose them on the LAN use 0.0.0.0:8890 and set gxtorrent_token (without a token Gextto starts the daemon in -insecure and logs it). Peer traffic always uses the single port/libtorrent_port_*."
  "Inglese (Regno Unito)": "English (United Kingdom)"
