  "Associa un tag del torrent a una cartella temporanea e finale.": "Maps a torrent tag to a temporary and a final folder."
  "Attiva l'autogestione di gx-torrent: coda dinamica e cache adattiva (dimensionata su memoria disponibile, download/seed attivi e tipo di storage). Predefinito attivo. Disattivalo per fissare a mano cache e slot.": "Turns on gx-torrent self-management: dynamic queue and adaptive cache (sized on available memory, active downloads/seeds and storage type). On by default. Turn it off to set cache and slots by hand."
  "Attiva la pulizia periodica dei dati tecnici e dello storico.": "Turns on the periodic cleanup of technical data and history."
  "Attiva log dettagliati e diagnostiche periodiche per il debug.": "Turns on detailed logs and periodic diagnostics for debugging."
  "Attiva o disattiva il daemon Gextto: cicli automatici e download.": "Turns the Gextto daemon on or off: automatic cycles and downloads."
  "Attivo: a fine seed il torrent completato viene tolto dalla sessione (come «Pulisci completati»). Spento: a fine seed il torrent resta nell'elenco come Completato e lo rimuovi tu con «Pulisci completati». Non influisce su dove vengono spostati i file.": "On: when seeding ends the completed torrent is removed from the session (like «Clean completed»). Off: it stays in the list as Completed and you remove it with «Clean completed». It does not affect where files are moved."
  "Attivo: al termine del seed la sorgente scaricata viene eliminata (il file resta in libreria). Spento: la sorgente scaricata viene copiata in libreria e mantenuta.": "On: when seeding ends the downloaded source is deleted (the file stays in the library). Off: the downloaded source is copied to the library and kept."
