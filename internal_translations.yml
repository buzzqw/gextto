  "Le release degli anime numerano gli episodi dall'inizio senza stagioni («Titolo - 1071»): Gextto converte il numero in stagione ed episodio con i dati TMDB e cerca anche il numero assoluto.": "Anime releases number episodes from the start without seasons (“Title - 1071”): Gextto maps the number to season and episode with TMDB data and also searches for the absolute number."
  "Una release migliore non sostituisce più un file già archiviato di questa serie.": "A better release no longer replaces a file of this series that is already archived."
  "Download in corso": "Downloads in progress"
  "Attivo: un file che resta in seed entra in libreria come hardlink, cioè un secondo nome per gli stessi dati, senza occupare spazio due volte. Cancellare uno dei due nomi non tocca l'altro. Funziona solo se download e libreria sono sullo stesso filesystem; altrimenti gextto copia come prima.": "On: a file that keeps seeding enters the library as a hardlink, a second name for the same data, without using the space twice. Deleting one of the two names does not touch the other. It works only when downloads and library are on the same filesystem; otherwise gextto copies as before."
  "Solo se Jellyfin vede la libreria con percorsi diversi (es. Docker): una riga per cartella, percorso_gextto=percorso_jellyfin. Serve per chiedere a Jellyfin di aggiornare solo la cartella appena cambiata.": "Only when Jellyfin sees the library under different paths (e.g. Docker): one line per folder, gextto_path=jellyfin_path. Used to ask Jellyfin to refresh only the folder that just changed."
  "Solo se Plex vede la libreria con percorsi diversi (es. Docker): una riga per cartella, percorso_gextto=percorso_plex. Serve per chiedere a Plex di aggiornare solo la cartella appena cambiata.": "Only when Plex sees the library under different paths (e.g. Docker): one line per folder, gextto_path=plex_path. Used to ask Plex to refresh only the folder that just changed."
  "Quando il file in libreria ha almeno questo punteggio non si cercano più miglioramenti; resta accettato solo un REPACK o PROPER che corregge una release difettosa. Riferimenti: 1080p WEB-DL H.264 ≈ 1280, 1080p WEB-DL H.265 DD+ ≈ 1480, 2160p ≈ 2480. 0 = migliora sempre. Per fermare del tutto gli upgrade di un solo titolo usa «Niente upgrade» nella sua scheda.": "Once the library file scores at least this much, no more improvements are searched; only a REPACK or PROPER that fixes a defective release is still accepted. References: 1080p WEB-DL H.264 ≈ 1280, 1080p WEB-DL H.265 DD+ ≈ 1480, 2160p ≈ 2480. 0 = always upgrade. To stop upgrades for a single title use “No upgrades” on its page."
  "Spento (predefinito): chiunque raggiunga gextto lo usa, come in una LAN fidata. Acceso: chi non è in rete locale deve fare il login o usare la chiave API. Resta aperto finché non imposti una password o una chiave. Se resti chiuso fuori, avvia gextto con GEXTTO_AUTH_DISABLE=1.": "Off (default): anyone who reaches gextto can use it, as on a trusted LAN. On: clients outside the local network must log in or use the API key. It stays open until you set a password or a key. If you lock yourself out, start gextto with GEXTTO_AUTH_DISABLE=1."
  "Acceso (predefinito): dalla rete di casa (127.0.0.1, 192.168.x.x, 10.x.x.x, 172.16-31.x.x) non serve il login. Dietro un reverse proxy conta l'indirizzo reale del client inoltrato dal proxy.": "On (default): no login is needed from the home network (127.0.0.1, 192.168.x.x, 10.x.x.x, 172.16-31.x.x). Behind a reverse proxy the real client address forwarded by the proxy counts."
  "Nome utente per il login (predefinito admin).": "Login username (default admin)."
  "Password per il login. Viene salvata solo come hash; lascia vuoto per non cambiarla.": "Login password. It is stored only as a hash; leave it empty to keep it unchanged."
  "Chiave per script, TUI (variabile GEXTTO_API_KEY) e calendario iCal: header X-Api-Key oppure ?apikey= nell'indirizzo. Scegli una stringa lunga e casuale.": "Key for scripts, the TUI (GEXTTO_API_KEY variable) and the iCal calendar: X-Api-Key header or ?apikey= in the address. Choose a long, random string."
