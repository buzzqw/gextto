  "Porta peer usata dal motore torrent. «Test porte» verifica che sia in ascolto e inoltrata dal router (disponibile con gx-torrent).": "Peer port used by the torrent engine. «Test ports» checks that it is listening and forwarded by the router (available with gx-torrent)."
