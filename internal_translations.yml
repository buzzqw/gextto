  # Remaining live labels and setting tooltips
  "Applica periodicamente l'ottimizzazione di cache, buffer e coda in base alle risorse, senza dover premere Ottimizza.": "Periodically apply cache, buffer and queue optimisation based on available resources, without clicking Optimise."
  "BitTorrent v1": "BitTorrent v1"
  "BitTorrent v2": "BitTorrent v2"
  "Dopo questi minuti senza aumento dei byte completati il torrent viene considerato stalled. La presenza di peer non basta a resettare il timer.": "After these minutes without an increase in completed bytes, the torrent is considered stalled. Having peers is not enough to reset the timer."
  "Dopo questo periodo senza progresso il torrent viene rimosso; 0 disabilita la rimozione automatica.": "After this period without progress, the torrent is removed; 0 disables automatic removal."
  "Dopo questo periodo senza progresso il torrent viene rimosso automaticamente. Imposta 0 per disattivare completamente la rimozione automatica per stallo.": "After this period without progress, the torrent is removed automatically. Set 0 to completely disable automatic removal due to stalling."
  "Elimina dalla sessione i torrent completati appena raggiungono i limiti di seed (ratio/tempo), senza dover premere Pulisci completati. I file si cancellano solo se la copia è già archiviata sul NAS.": "Remove completed torrents from the session as soon as they reach the seeding limits (ratio/time), without clicking Clean completed. Files are deleted only when a copy is already archived on the NAS."
  "Hybrid (v1 + v2)": "Hybrid (v1 + v2)"
  "I torrent che non trasferiscono dati non consumano uno slot attivo: gli swarm senza peer non bloccano i download sani.": "Torrents that transfer no data do not consume an active slot: swarms without peers do not block healthy downloads."
  "Intervallo tra i tentativi di reannounce dei torrent stalled, mantenuti fuori dalla coda attiva.": "Interval between reannounce attempts for stalled torrents, which remain outside the active queue."
  "Killswitch VPN: interfaccia usata per tutto il traffico BitTorrent in uscita (es. tun0, wg0).": "VPN killswitch: interface used for all outgoing BitTorrent traffic (e.g. tun0, wg0)."
  "Limite di seeding in minuti, usato solo se Seed massimo (giorni) è 0; utile per limiti inferiori a 24 ore.": "Seeding limit in minutes, used only when Maximum seed (days) is 0; useful for limits below 24 hours."
  "Limite principale di seeding in giorni; se maggiore di 0 prevale sul limite in minuti.": "Primary seeding limit in days; when greater than 0 it takes precedence over the limit in minutes."
  "Numero massimo di download dinamici. Servono campioni consecutivi coerenti prima di aumentare la coda.": "Maximum number of dynamic downloads. Consecutive consistent samples are required before increasing the queue."
  "Numero minimo di download dinamici. La coda cambia al massimo di uno per volta.": "Minimum number of dynamic downloads. The queue changes by at most one at a time."
  "Valore base dei download attivi. Con la coda dinamica Gextto lo adatta a runtime tra il minimo e il massimo configurati.": "Baseline number of active downloads. With the dynamic queue, Gextto adjusts it at runtime between the configured minimum and maximum."
  "Valore base dei seed attivi. Con la coda dinamica scende a 1 quando ci sono download in coda.": "Baseline number of active seeds. With the dynamic queue, it drops to 1 when downloads are queued."
  "Valore base del limite di torrent attivi. Con la coda dinamica diventa max(base, download + seed + 2).": "Baseline active-torrent limit. With the dynamic queue, it becomes max(base, downloads + seeds + 2)."
