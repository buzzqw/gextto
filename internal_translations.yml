  "Killswitch VPN: interfaccia usata per tutto il traffico BitTorrent in uscita.": "VPN kill switch: interface used for all outgoing BitTorrent traffic."
  "L'URL o il file si impostano nei campi «IP filter» qui nella scheda; con un URL Gextto lo scarica e lo applica. Funziona anche con gx-torrent.": "The URL or file is set in the «IP filter» fields of this section; with a URL Gextto downloads and applies it. It works with gx-torrent too."
  "Le release che contengono queste parole o script (es. [non-latino], [porno]) vengono escluse. Le modifiche si salvano subito.": "Releases containing these words or scripts (e.g. [non-latino], [porno]) are excluded. Changes are saved right away."
