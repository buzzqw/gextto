  "Installa / Ottimizza qBittorrent-nox": "Install / Optimize qBittorrent-nox"
  "Intervallo in millisecondi tra due letture dello stato dei torrent.": "Interval in milliseconds between two reads of the torrent status."
  "Intervallo minimo in millisecondi tra due letture dello stato dei torrent (250–60000, predefinito 1500). La coda è gestita da gx-torrent stesso, non dipende da questo valore.": "Minimum interval in milliseconds between two reads of the torrent status (250–60000, default 1500). The queue is handled by gx-torrent itself and does not depend on this value."
  "Intervallo tra due housekeeping automatici, in ore.": "Interval between two automatic housekeeping runs, in hours."
