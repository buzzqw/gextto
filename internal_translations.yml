  "Punteggio in meno per l'alternativa": "Score drop for the alternative"
  "Se un download è fermo da almeno questi minuti — a 0 B/s oppure ancora in attesa del suo elenco di file (metadati, tipico dei magnet morti) — la ricerca può avviare una versione alternativa della stessa puntata o film. Il download fermo resta in sessione e può riprendersi; la deduplica dell'archivio terrà poi la copia migliore. 0 disattiva.": "If a download has been stuck for at least these minutes — at 0 B/s or still waiting for its file list (metadata, typical of dead magnets) — the search may start an alternative version of the same episode or movie. The stuck download stays in the session and may still recover; archive deduplication will then keep the best copy. 0 disables."
  "Quanti punti di punteggio in meno sono accettati per l'alternativa rispetto alla release bloccata. Il download bloccato non viene rimosso: parte solo un'alternativa adeguata (non una versione scadente). 0 disattiva.": "How many points below the stuck release an alternative may score. The stuck download is not removed: only an adequate alternative is started (never a poor version). 0 disables."
