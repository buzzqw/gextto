  "Il test verifica solo la disponibilità locale del bind. Non può confermare da solo l'apertura sul router/firewall o la raggiungibilità da Internet; una porta occupata dal listener libtorrent è normale quando il servizio è attivo.": "This test checks local bind availability only. It cannot by itself confirm router/firewall forwarding or Internet reachability; a port in use by the libtorrent listener is normal while the service is running."

