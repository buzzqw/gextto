  "Requisito PREFERENZIALE (non obbligatorio): non filtra né scarta. Ogni lingua sub trovata nel titolo aggiunge +200 punti allo score, alzando la priorità di quel torrent nel confronto tra candidati. Con più lingue (es. Italiano + Inglese): +200 se trovato solo uno, +400 se trovati entrambi. Il torrent con più lingue sub vince a parità di qualità. Valido sia per serie TV che per film.": "PREFERENTIAL requirement (not mandatory): does not filter or discard. Each sub language found in the title adds +200 points to the score, raising the priority of that torrent in the comparison between candidates. With multiple languages ​​(e.g. Italian + English): +200 if only one is found, +400 if both are found. The torrent with the most sub languages ​​wins with equal quality. Valid for both TV series and films."
