  "Ogni 6 ore scarica da GitHub le informazioni sull'ultima versione e, se ce n'è una nuova, mostra «Aggiornamento disponibile». Non invia dati e non aggiorna da solo: l'aggiornamento parte solo da Manutenzione.": "Every 6 hours downloads the latest release information from GitHub and, when a newer one exists, shows «Update available». It sends no data and never updates on its own: the update only starts from Maintenance."
