  ", oppure, per NFS/SMB, controlla le opzioni di montaggio (uid/gid, all_squash).": ", or, for NFS/SMB, check the mount options (uid/gid, all_squash)."
  "Da dove cercare": "Where to search"
  "Gextto cerca le release negli indexer di Prowlarr o Jackett e usa TMDB per titoli, locandine e calendario. Puoi aggiungerne altri dopo, in Impostazioni.": "Gextto searches releases in the Prowlarr or Jackett indexers and uses TMDB for titles, posters and the calendar. You can add more later, in Settings."
  "Indexer configurati": "Configured indexers"
  "Aggiungi un indexer": "Add an indexer"
  "Gratuita su themoviedb.org → Impostazioni → API.": "Free on themoviedb.org → Settings → API."
  "La tua prima serie o il tuo primo film": "Your first series or movie"
  "Cerca un titolo su TMDB e aggiungilo: Gextto lo cercherà e lo scaricherà al prossimo ciclo.": "Search a title on TMDB and add it: Gextto will search and download it in the next cycle."
  "In libreria": "In the library"
  "Senza la TMDB API key la ricerca dei titoli non è disponibile: aggiungila al passo precedente, oppure aggiungi i titoli dopo da Serie TV e Film.": "Without the TMDB API key title search is not available: add it in the previous step, or add the titles later from TV series and Movies."
  "Pronto a partire": "Ready to start"
  "Manca": "Missing"
  "Cartella della libreria": "Library folder"
  "Almeno un indexer": "At least one indexer"
  "Almeno un titolo in libreria": "At least one title in the library"
  "Avvia la ricerca automatica (ciclo ogni 6 ore)": "Start the automatic search (cycle every 6 hours)"
  "Scarica davvero (disattiva la modalità prova)": "Really download (turn off test mode)"
  "In modalità prova Gextto cerca e mostra cosa scaricherebbe, senza scaricare nulla: utile per verificare filtri e qualità.": "In test mode Gextto searches and shows what it would download, without downloading anything: useful to check filters and quality."
  "Salta la configurazione guidata": "Skip the guided setup"
  "Accesso protetto da password.": "Access protected by password."
  "Cartelle salvate.": "Folders saved."
  "Indica il nome utente.": "Enter the user name."
  "Indica una password.": "Enter a password."
  "La password deve avere almeno 8 caratteri.": "The password must be at least 8 characters long."
  "Le due password non coincidono.": "The two passwords do not match."
  "Indirizzo dell'indexer non valido: usa http://host:porta.": "Invalid indexer address: use http://host:port."
  "Indica la cartella della libreria.": "Enter the library folder."
  "Serve un percorso assoluto (che inizia con /).": "An absolute path is needed (starting with /)."
  "Esiste ma non è una cartella.": "It exists but is not a folder."
  "La cartella non esiste: se è sul NAS, controlla che sia montata.": "The folder does not exist: if it is on the NAS, check that it is mounted."
  "L'utente del servizio non può scrivere qui.": "The service user cannot write here."
  "Indietro": "Back"
  "Continua": "Continue"
  "Tipo di contenuto": "Content type"
  "Gextto cerca le release negli indexer di Prowlarr o Jackett e prende titoli, stagioni, episodi, locandine e calendario da TMDB (consigliato) oppure da TVDB. Basta una delle due chiavi: se ci sono entrambe vince TMDB. Puoi aggiungere altro dopo, in Impostazioni.": "Gextto searches releases in the Prowlarr or Jackett indexers and takes titles, seasons, episodes, posters and the calendar from TMDB (recommended) or from TVDB. One of the two keys is enough: with both, TMDB wins. You can add more later, in Settings."
  "TMDB (consigliato)": "TMDB (recommended)"
  "Gratuita su themoviedb.org → Impostazioni → API. È la fonte consigliata.": "Free on themoviedb.org → Settings → API. It is the recommended source."
  "TVDB (alternativa)": "TVDB (alternative)"
  "PIN abbonato": "Subscriber PIN"
  "solo se la chiave lo richiede": "only if the key requires it"
  "Usata al posto di TMDB quando manca la chiave TMDB. Chiave v4 da thetvdb.com → Dashboard → API keys. Le chiavi «user-supported» richiedono un abbonamento TVDB e il suo PIN. Con TVDB manca solo la sezione Scopri.": "Used instead of TMDB when the TMDB key is missing. v4 key from thetvdb.com → Dashboard → API keys. “User-supported” keys require a TVDB subscription and its PIN. With TVDB only the Discover section is missing."
  "Cerca un titolo su TVDB e aggiungilo: Gextto lo cercherà e lo scaricherà al prossimo ciclo.": "Search a title on TVDB and add it: Gextto will search and download it in the next cycle."
  "Titolo da cercare su TVDB": "Title to search on TVDB"
  "Cerca su TVDB": "Search TVDB"
  "Senza una API key TMDB o TVDB la ricerca dei titoli non è disponibile: aggiungila al passo precedente, oppure aggiungi i titoli dopo da Serie TV e Film.": "Without a TMDB or TVDB API key title search is not available: add one in the previous step, or add the titles later from TV series and Movies."
  "TVDB API key (TMDB è consigliata; senza TMDB manca la sezione Scopri)": "TVDB API key (TMDB is recommended; without TMDB the Discover section is missing)"
  "TMDB o TVDB API key": "TMDB or TVDB API key"
  "TMDB API key (consigliata)": "TMDB API key (recommended)"
  "TVDB API key (alternativa a TMDB)": "TVDB API key (alternative to TMDB)"
  "TVDB PIN abbonato": "TVDB subscriber PIN"
  "Chiave API v4 di TheTVDB. Senza la chiave TMDB, TVDB fornisce tutti i metadati: ricerca dei titoli, stagioni ed episodi, mancanti, numerazione anime, stato, calendario, titoli degli episodi e locandine (non la sezione Scopri).": "TheTVDB v4 API key. Without the TMDB key, TVDB provides all the metadata: title search, seasons and episodes, missing episodes, anime numbering, status, calendar, episode titles and posters (not the Discover section)."
  "PIN dell'abbonamento TheTVDB: serve solo con le chiavi di tipo «user-supported», che lo richiedono al login.": "TheTVDB subscription PIN: needed only by “user-supported” keys, which ask for it at login."
  "Chiave API TMDB (consigliata, gratuita): fonte principale di titoli, poster e metadati. Se c'è, ha la precedenza su TVDB.": "TMDB API key (recommended, free): the main source of titles, posters and metadata. When set, it takes precedence over TVDB."
  "Prima/ultima parte dei file": "First/last piece of files"
  "Scarica per primi l'inizio e la fine di ogni file in tutti i nuovi torrent, poi prosegue normalmente: utile per guardare un video mentre scarica. Vale con ogni motore; i torrent già in corso non cambiano.": "Download the start and end of every file first in all new torrents, then continue normally: useful to watch a video while it downloads. Works with every engine; torrents already running are not changed."
  "Storia": "History"
  "ID acquisizione": "Acquisition ID"
  "ID acquisizione:": "Acquisition ID:"
  "Mostra nel log": "Show in the log"
  "Apri il log filtrato su questo download": "Open the log filtered on this download"
  "Ogni riga del log di questo download contiene questo ID.": "Every log line about this download contains this ID."
  "Storia del download": "Download history"
  "Quando": "When"
  "Evento": "Event"
  "Ripetuto più volte: l'ora è quella dell'ultima": "Repeated several times: the time is the last one"
  "dal": "since"
  "avviso": "warning"
  "Nessun evento registrato per questo download. La storia si costruisce dalle righe di log scritte da questa versione in poi.": "No event recorded for this download. The history is built from the log lines written from this version on."
  "Storia dei download": "Download history"
  "Ultimi 50 eventi; 📜 su una puntata mostra la sua storia completa.": "Last 50 events; 📜 on an episode shows its full history."
  "Storia dei download di questa puntata: ricerca, download, spostamenti, errori": "Download history of this episode: search, download, moves, errors"
  "Storia dei download della puntata": "Download history of the episode"
  "Stagione o episodio non validi.": "Invalid season or episode."
